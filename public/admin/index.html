<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>EpicKor Blog Admin</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  
  <!-- Point to the Decap CMS config file -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
  
  <!-- Custom Styles -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    
    /* Custom branding */
    .nc-app-header {
      background-color: #2C2416 !important;
    }
    
    .nc-app-header-button {
      color: #FAF6F0 !important;
    }
    
    /* Loading indicator */
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 1.5rem;
      color: #2C2416;
    }
  </style>
</head>
<body>
  <!-- Loading indicator -->
  <div id="loading">Loading EpicKor Blog Admin...</div>

  <!-- Force manual init so preview templates/styles are registered before CMS boots -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
  
  <!-- Include the script that builds the page and powers Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <!-- Custom initialization after CMS loads -->
  <script>
    window.addEventListener('load', function() {
      // Hide loading indicator
      const loadingEl = document.getElementById('loading');
      if (loadingEl) {
        loadingEl.style.display = 'none';
      }
      
      // Check if CMS is available
      if (typeof CMS === 'undefined') {
        console.error('Decap CMS failed to load');
        document.body.innerHTML = '<div style="padding: 2rem; text-align: center;"><h1>Error</h1><p>Failed to load Decap CMS. Please refresh the page.</p></div>';
        return;
      }
      
      // Register preview style/template before CMS.init()
      CMS.registerPreviewStyle("/admin/preview.css");

      const createClassFn = window.createClass || null;
      const hFn = window.h || null;
      const getFallbackBodyText = () => {
        try {
          const domBodyField = document.querySelector(
            'textarea[name="body"], textarea[id*="body"], [data-testid*="body"] textarea'
          );
          if (domBodyField && typeof domBodyField.value === 'string' && domBodyField.value.trim()) {
            return domBodyField.value;
          }
        } catch (_e) {}

        if (typeof window.__EPICKOR_LAST_MD_BODY === 'string' && window.__EPICKOR_LAST_MD_BODY.trim()) {
          return window.__EPICKOR_LAST_MD_BODY;
        }

        return '';
      };

      if (createClassFn && hFn) {
        const BlogPreviewTemplate = createClassFn({
          render: function() {
            const entry = this.props && this.props.entry ? this.props.entry : null;
            const data = entry && entry.get ? entry.get('data') : null;
            const title = data && data.get ? data.get('title') : '';
            const entryBody = entry && entry.getIn ? (entry.getIn(['data', 'body']) || '') : '';
            const rawBody = entryBody || getFallbackBodyText();
            const bodyLen = rawBody ? rawBody.length : 0;
            const bodyWidget = (this.props && typeof this.props.widgetFor === 'function')
              ? this.props.widgetFor('body')
              : null;
            const bodyNode = bodyWidget
              || hFn(
                'div',
                { style: { whiteSpace: 'pre-wrap', fontSize: '14px', lineHeight: '1.7', color: '#2C2416', marginTop: '12px' } },
                rawBody || '(body is empty)'
              );

            return hFn(
              'article',
              { className: 'epickor-admin-preview' },
              hFn('div', { style: { fontSize: '11px', opacity: 0.65, marginBottom: '8px' } }, `Preview template active (v20260224i, body=${bodyLen})`),
              hFn('h1', null, title || 'Untitled'),
              bodyNode
            );
          }
        });

        ['blog', 'Blog Posts', 'blog_posts', 'blog-posts'].forEach((key) => {
          CMS.registerPreviewTemplate(key, BlogPreviewTemplate);
        });
      } else {
        const fallbackTemplate = function(props) {
          const entryBody = (props && props.entry && typeof props.entry.getIn === 'function')
            ? (props.entry.getIn(['data', 'body']) || '')
            : '';
          const rawBody = entryBody || getFallbackBodyText();
          return rawBody || '(body is empty)';
        };

        ['blog', 'Blog Posts', 'blog_posts', 'blog-posts'].forEach((key) => {
          CMS.registerPreviewTemplate(key, fallbackTemplate);
        });
      }

      console.log('Blog preview template registered');

      // Load custom widgets first, then initialize CMS once.
      let cmsInitialized = false;
      const initCmsOnce = () => {
        if (cmsInitialized) return;
        cmsInitialized = true;
        CMS.init();
        console.log('Decap CMS initialized (manual init)');
      };

      const customScript = document.createElement('script');
      customScript.src = '/admin/custom-widgets.js?v=20260224j';
      customScript.onload = function() {
        console.log('Custom widgets loaded');
        initCmsOnce();
      };
      customScript.onerror = function() {
        console.error('Failed to load custom widgets');
        initCmsOnce();
      };
      document.body.appendChild(customScript);
    });
  </script>
</body>
</html>
