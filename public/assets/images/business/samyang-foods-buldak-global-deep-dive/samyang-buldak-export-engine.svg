<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Samyang Foods Buldak export engine</title>
  <desc id="desc">A five-stage map connecting distinctive Buldak products, social participation, Korean export manufacturing, regional execution, and portfolio expansion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15120f"/>
      <stop offset="1" stop-color="#2c1710"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#ff7441"/>
    </marker>
  </defs>
  <rect width="1600" height="920" rx="36" fill="url(#bg)"/>
  <circle cx="1410" cy="100" r="250" fill="#ff5a2a" opacity=".1"/>
  <circle cx="170" cy="830" r="260" fill="#ffba7a" opacity=".06"/>
  <text x="110" y="115" fill="#ff7441" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="5">EPICKOR BUSINESS MAP</text>
  <text x="110" y="185" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800">How Buldak Became an Export Engine</text>
  <text x="110" y="235" fill="#d8cdc7" font-family="Arial, Helvetica, sans-serif" font-size="25">Attention becomes durable growth only when product, capacity, and local execution reinforce each other.</text>

  <g filter="url(#shadow)">
    <rect x="80" y="340" width="270" height="310" rx="28" fill="#fff8f2"/>
    <rect x="372" y="340" width="270" height="310" rx="28" fill="#fff8f2"/>
    <rect x="664" y="340" width="270" height="310" rx="28" fill="#fff8f2"/>
    <rect x="956" y="340" width="270" height="310" rx="28" fill="#fff8f2"/>
    <rect x="1248" y="340" width="270" height="310" rx="28" fill="#fff8f2"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <g>
      <circle cx="135" cy="405" r="28" fill="#ff5a2a"/>
      <text x="135" y="415" fill="#fff" text-anchor="middle" font-size="26" font-weight="800">1</text>
      <text x="115" y="476" fill="#231a15" font-size="29" font-weight="800">Distinctive</text>
      <text x="115" y="514" fill="#231a15" font-size="29" font-weight="800">Product</text>
      <text x="115" y="565" fill="#6b5c54" font-size="22">Heat + sauce</text>
      <text x="115" y="598" fill="#6b5c54" font-size="22">Recognizable pack</text>
    </g>
    <g>
      <circle cx="427" cy="405" r="28" fill="#ff5a2a"/>
      <text x="427" y="415" fill="#fff" text-anchor="middle" font-size="26" font-weight="800">2</text>
      <text x="407" y="476" fill="#231a15" font-size="29" font-weight="800">Social</text>
      <text x="407" y="514" fill="#231a15" font-size="29" font-weight="800">Participation</text>
      <text x="407" y="565" fill="#6b5c54" font-size="22">Reaction + challenge</text>
      <text x="407" y="598" fill="#6b5c54" font-size="22">Fan-made discovery</text>
    </g>
    <g>
      <circle cx="719" cy="405" r="28" fill="#ff5a2a"/>
      <text x="719" y="415" fill="#fff" text-anchor="middle" font-size="26" font-weight="800">3</text>
      <text x="699" y="476" fill="#231a15" font-size="29" font-weight="800">Export</text>
      <text x="699" y="514" fill="#231a15" font-size="29" font-weight="800">Manufacturing</text>
      <text x="699" y="565" fill="#6b5c54" font-size="22">Miryang capacity</text>
      <text x="699" y="598" fill="#6b5c54" font-size="22">Safety + supply</text>
    </g>
    <g>
      <circle cx="1011" cy="405" r="28" fill="#ff5a2a"/>
      <text x="1011" y="415" fill="#fff" text-anchor="middle" font-size="26" font-weight="800">4</text>
      <text x="991" y="476" fill="#231a15" font-size="29" font-weight="800">Regional</text>
      <text x="991" y="514" fill="#231a15" font-size="29" font-weight="800">Execution</text>
      <text x="991" y="565" fill="#6b5c54" font-size="22">Subsidiaries</text>
      <text x="991" y="598" fill="#6b5c54" font-size="22">Retail + localization</text>
    </g>
    <g>
      <circle cx="1303" cy="405" r="28" fill="#ff5a2a"/>
      <text x="1303" y="415" fill="#fff" text-anchor="middle" font-size="26" font-weight="800">5</text>
      <text x="1283" y="476" fill="#231a15" font-size="29" font-weight="800">Portfolio</text>
      <text x="1283" y="514" fill="#231a15" font-size="29" font-weight="800">Expansion</text>
      <text x="1283" y="565" fill="#6b5c54" font-size="22">Flavors + sauce</text>
      <text x="1283" y="598" fill="#6b5c54" font-size="22">More occasions</text>
    </g>
  </g>

  <g stroke="#ff7441" stroke-width="8" fill="none" marker-end="url(#arrow)">
    <path d="M350 495 H368"/>
    <path d="M642 495 H660"/>
    <path d="M934 495 H952"/>
    <path d="M1226 495 H1244"/>
  </g>
  <path d="M1380 660 C1370 795 310 805 220 674" stroke="#ffba7a" stroke-width="7" fill="none" stroke-dasharray="14 12" marker-end="url(#arrow)"/>
  <text x="800" y="790" fill="#ffcfaa" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">More formats create more trial, feedback, retailer demand, and capacity signals</text>
  <text x="1490" y="866" fill="#a9968c" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="end">Company-reported public information · July 2026</text>
</svg>
