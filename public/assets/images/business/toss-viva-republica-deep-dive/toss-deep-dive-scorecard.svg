<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Toss deep dive scorecard</title>
  <desc id="desc">A scorecard-style infographic summarizing Toss's past, present, future, strengths, and watch items.</desc>
  <rect width="1400" height="900" fill="#eef5ff"/>
  <rect x="78" y="80" width="1244" height="740" rx="36" fill="#ffffff" stroke="#c9dcff" stroke-width="3"/>
  <text x="126" y="150" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#111827">Toss company deep dive</text>
  <text x="128" y="198" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#667085">A public-information scorecard for overseas operators</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22">
    <rect x="126" y="255" width="340" height="410" rx="26" fill="#f8fbff" stroke="#d7e6ff"/>
    <text x="162" y="315" font-size="31" font-weight="800" fill="#1f5fd6">Past</text>
    <text x="162" y="370" fill="#253044">2015 simple transfer</text>
    <text x="162" y="414" fill="#253044">Reduced finance friction</text>
    <text x="162" y="458" fill="#253044">Trust built through UX</text>
    <text x="162" y="502" fill="#253044">Expanded service surface</text>
    <rect x="162" y="560" width="220" height="50" rx="25" fill="#3182f6"/>
    <text x="215" y="593" font-size="20" font-weight="700" fill="#ffffff">origin story</text>
    <rect x="530" y="255" width="340" height="410" rx="26" fill="#f7f7fb" stroke="#dddded"/>
    <text x="566" y="315" font-size="31" font-weight="800" fill="#172033">Present</text>
    <text x="566" y="370" fill="#253044">More than one in two</text>
    <text x="566" y="414" fill="#253044">Koreans registered</text>
    <text x="566" y="458" fill="#253044">Bank, securities, pay</text>
    <text x="566" y="502" fill="#253044">Merchant tools included</text>
    <rect x="566" y="560" width="230" height="50" rx="25" fill="#172033"/>
    <text x="617" y="593" font-size="20" font-weight="700" fill="#ffffff">super-app test</text>
    <rect x="934" y="255" width="340" height="410" rx="26" fill="#f3fff8" stroke="#c2ebd5"/>
    <text x="970" y="315" font-size="31" font-weight="800" fill="#087344">Future</text>
    <text x="970" y="370" fill="#253044">Regulatory discipline</text>
    <text x="970" y="414" fill="#253044">Cross-sell without clutter</text>
    <text x="970" y="458" fill="#253044">Merchant monetization</text>
    <text x="970" y="502" fill="#253044">Possible global lessons</text>
    <rect x="970" y="560" width="230" height="50" rx="25" fill="#10a869"/>
    <text x="1023" y="593" font-size="20" font-weight="700" fill="#ffffff">next phase</text>
  </g>
  <text x="126" y="740" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172033">Editorial note:</text>
  <text x="310" y="740" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#526071">Private-company financial claims should be sourced carefully and labeled by date.</text>
</svg>
