<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Korean packaging supplier buyer map</title>
  <desc id="desc">A buyer workflow from packaging category to supplier role, sample, documentation, and export-ready purchase order.</desc>
  <rect width="1200" height="675" fill="#f7f6ef"/>
  <rect x="56" y="54" width="1088" height="567" rx="28" fill="#ffffff" stroke="#d8d6ca" stroke-width="2"/>
  <text x="96" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#1c2320">Korean Packaging Supplier Map</text>
  <text x="96" y="153" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#56615c">Use packaging as a sourcing workflow, not just a box quote.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="95" y="215" width="180" height="130" rx="18" fill="#174c63"/>
    <text x="185" y="258" text-anchor="middle" font-size="21" font-weight="800" fill="#ffffff">Category</text>
    <text x="185" y="294" text-anchor="middle" font-size="17" fill="#dceff5">Cosmetics</text>
    <text x="185" y="319" text-anchor="middle" font-size="17" fill="#dceff5">Food</text>

    <path d="M292 280 H376" stroke="#c9a84c" stroke-width="8" stroke-linecap="round"/>
    <path d="M365 262 L392 280 L365 298" fill="none" stroke="#c9a84c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="405" y="215" width="180" height="130" rx="18" fill="#f0e7c7" stroke="#c9a84c" stroke-width="2"/>
    <text x="495" y="254" text-anchor="middle" font-size="21" font-weight="800" fill="#1c2320">Supplier Role</text>
    <text x="495" y="290" text-anchor="middle" font-size="17" fill="#4c4a40">Converter</text>
    <text x="495" y="315" text-anchor="middle" font-size="17" fill="#4c4a40">Trading partner</text>

    <path d="M602 280 H686" stroke="#c9a84c" stroke-width="8" stroke-linecap="round"/>
    <path d="M675 262 L702 280 L675 298" fill="none" stroke="#c9a84c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="715" y="215" width="180" height="130" rx="18" fill="#eef3f1" stroke="#b8c6c0" stroke-width="2"/>
    <text x="805" y="254" text-anchor="middle" font-size="21" font-weight="800" fill="#1c2320">Sample</text>
    <text x="805" y="290" text-anchor="middle" font-size="17" fill="#46524d">Material</text>
    <text x="805" y="315" text-anchor="middle" font-size="17" fill="#46524d">Print, fit, transit</text>

    <path d="M912 280 H996" stroke="#c9a84c" stroke-width="8" stroke-linecap="round"/>
    <path d="M985 262 L1012 280 L985 298" fill="none" stroke="#c9a84c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1025" y="215" width="80" height="130" rx="18" fill="#174c63"/>
    <text x="1065" y="254" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">PO</text>
    <text x="1065" y="292" text-anchor="middle" font-size="15" fill="#dceff5">Export</text>
    <text x="1065" y="315" text-anchor="middle" font-size="15" fill="#dceff5">ready</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#1f2a25">
    <rect x="96" y="425" width="316" height="104" rx="18" fill="#f6f0d8"/>
    <circle cx="126" cy="459" r="7" fill="#c9a84c"/>
    <text x="146" y="465" font-weight="700">Ask for material specs, not just photos.</text>
    <circle cx="126" cy="495" r="7" fill="#c9a84c"/>
    <text x="146" y="501" font-weight="700">Separate box, label, pouch, closure, and insert.</text>

    <rect x="442" y="425" width="316" height="104" rx="18" fill="#eef3f1"/>
    <circle cx="472" cy="459" r="7" fill="#174c63"/>
    <text x="492" y="465" font-weight="700">Confirm who controls tooling and artwork.</text>
    <circle cx="472" cy="495" r="7" fill="#174c63"/>
    <text x="492" y="501" font-weight="700">Check MOQ by component, color, and print run.</text>

    <rect x="788" y="425" width="316" height="104" rx="18" fill="#f6f0d8"/>
    <circle cx="818" cy="459" r="7" fill="#c9a84c"/>
    <text x="838" y="465" font-weight="700">Match sample to shipment and compliance needs.</text>
    <circle cx="818" cy="495" r="7" fill="#c9a84c"/>
    <text x="838" y="501" font-weight="700">Document cartons, labels, barcodes, and tests.</text>
  </g>

  <text x="96" y="584" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#707971">EpicKor Business Editor | epickor.com/business</text>
</svg>
