<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Packaging sourcing checkpoints for overseas buyers</title>
  <desc id="desc">A checklist for packaging samples, artwork, compliance, logistics, and commercial terms.</desc>
  <rect width="1200" height="675" fill="#eef3f1"/>
  <rect x="64" y="60" width="1072" height="555" rx="26" fill="#ffffff" stroke="#d6ded9" stroke-width="2"/>
  <text x="106" y="125" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#18221e">Packaging Checks Before You Source</text>
  <text x="106" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#5d6862">Use these checkpoints before sampling, tooling, or deposit payments.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(106 222)">
      <rect width="302" height="112" rx="18" fill="#174c63"/>
      <text x="28" y="42" font-size="22" font-weight="800" fill="#ffffff">1. Fit And Material</text>
      <text x="28" y="74" font-size="17" fill="#dceff5">Bottle, tube, pouch, carton, film,</text>
      <text x="28" y="99" font-size="17" fill="#dceff5">insert, closure, and compatibility.</text>
    </g>
    <g transform="translate(449 222)">
      <rect width="302" height="112" rx="18" fill="#f3e9c4" stroke="#c9a84c" stroke-width="2"/>
      <text x="28" y="42" font-size="22" font-weight="800" fill="#1c2320">2. Artwork Control</text>
      <text x="28" y="74" font-size="17" fill="#4c4a40">Dieline, language, barcode, color,</text>
      <text x="28" y="99" font-size="17" fill="#4c4a40">brand files, and revision ownership.</text>
    </g>
    <g transform="translate(792 222)">
      <rect width="302" height="112" rx="18" fill="#174c63"/>
      <text x="28" y="42" font-size="22" font-weight="800" fill="#ffffff">3. Rules And Claims</text>
      <text x="28" y="74" font-size="17" fill="#dceff5">Food-contact, cosmetic claims,</text>
      <text x="28" y="99" font-size="17" fill="#dceff5">destination-market label review.</text>
    </g>

    <g transform="translate(106 382)">
      <rect width="302" height="112" rx="18" fill="#f3e9c4" stroke="#c9a84c" stroke-width="2"/>
      <text x="28" y="42" font-size="22" font-weight="800" fill="#1c2320">4. Logistics Reality</text>
      <text x="28" y="74" font-size="17" fill="#4c4a40">Carton strength, pallet pattern,</text>
      <text x="28" y="99" font-size="17" fill="#4c4a40">humidity, drop risk, and lead time.</text>
    </g>
    <g transform="translate(449 382)">
      <rect width="302" height="112" rx="18" fill="#174c63"/>
      <text x="28" y="42" font-size="22" font-weight="800" fill="#ffffff">5. Commercial Terms</text>
      <text x="28" y="74" font-size="17" fill="#dceff5">MOQ, tooling fee, sample fee,</text>
      <text x="28" y="99" font-size="17" fill="#dceff5">payment, and defect handling.</text>
    </g>
    <g transform="translate(792 382)">
      <rect width="302" height="112" rx="18" fill="#f3e9c4" stroke="#c9a84c" stroke-width="2"/>
      <text x="28" y="42" font-size="22" font-weight="800" fill="#1c2320">6. Proof Trail</text>
      <text x="28" y="74" font-size="17" fill="#4c4a40">Quote version, sample code,</text>
      <text x="28" y="99" font-size="17" fill="#4c4a40">inspection plan, and final approval.</text>
    </g>
  </g>

  <text x="106" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#69746e">EpicKor Business Editor | packaging supplier due diligence</text>
</svg>
