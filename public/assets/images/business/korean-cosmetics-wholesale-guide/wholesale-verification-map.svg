<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Korean cosmetics wholesale verification map</title>
  <desc id="desc">A buyer-side map for checking brand authorization, seller identity, batch traceability, documents, payment terms, destination-market rules, and repeat supply before buying Korean cosmetics wholesale.</desc>
  <rect width="1400" height="860" fill="#f7faf9"/>
  <rect x="54" y="54" width="1292" height="752" rx="32" fill="#ffffff" stroke="#d7e6df" stroke-width="4"/>
  <text x="92" y="126" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800" fill="#10352f">Wholesale check before payment</text>
  <text x="92" y="170" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#51625d">Use the supplier list to build options. Use the proof trail to decide who is safe enough to buy from.</text>

  <g transform="translate(92 234)">
    <rect width="360" height="178" rx="20" fill="#e7f6f0" stroke="#9bd5c3" stroke-width="3"/>
    <circle cx="48" cy="50" r="22" fill="#13866f"/>
    <text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff">1</text>
    <text x="86" y="54" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#10352f">Seller role</text>
    <text x="38" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">Brand owner, authorized</text>
    <text x="38" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">distributor, trading company,</text>
    <text x="38" y="160" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">marketplace seller, or broker?</text>
  </g>

  <g transform="translate(520 234)">
    <rect width="360" height="178" rx="20" fill="#fff6dd" stroke="#efd37d" stroke-width="3"/>
    <circle cx="48" cy="50" r="22" fill="#bf7b00"/>
    <text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff">2</text>
    <text x="86" y="54" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#10352f">Authorization</text>
    <text x="38" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">Ask for territory, channel,</text>
    <text x="38" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">brand permission, invoice trail,</text>
    <text x="38" y="160" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">and written resale limits.</text>
  </g>

  <g transform="translate(948 234)">
    <rect width="360" height="178" rx="20" fill="#eef2ff" stroke="#bbc7f7" stroke-width="3"/>
    <circle cx="48" cy="50" r="22" fill="#4053b8"/>
    <text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff">3</text>
    <text x="86" y="54" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#10352f">Batch proof</text>
    <text x="38" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">Match lot code, expiry,</text>
    <text x="38" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">COA or spec sheet, carton</text>
    <text x="38" y="160" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">photos, and packing list.</text>
  </g>

  <g transform="translate(92 470)">
    <rect width="360" height="178" rx="20" fill="#f4ecff" stroke="#d3b6f7" stroke-width="3"/>
    <circle cx="48" cy="50" r="22" fill="#7352b8"/>
    <text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff">4</text>
    <text x="86" y="54" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#10352f">Label rules</text>
    <text x="38" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">Korean label is not enough.</text>
    <text x="38" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">Check ingredients, claims,</text>
    <text x="38" y="160" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">warnings, importer, language.</text>
  </g>

  <g transform="translate(520 470)">
    <rect width="360" height="178" rx="20" fill="#eaf7ff" stroke="#9dd2ef" stroke-width="3"/>
    <circle cx="48" cy="50" r="22" fill="#1b78a3"/>
    <text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff">5</text>
    <text x="86" y="54" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#10352f">Commercial risk</text>
    <text x="38" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">MOQ, payment method,</text>
    <text x="38" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">defect policy, return limits,</text>
    <text x="38" y="160" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">and repeat-stock promise.</text>
  </g>

  <g transform="translate(948 470)">
    <rect width="360" height="178" rx="20" fill="#fff0ee" stroke="#f2b1a8" stroke-width="3"/>
    <circle cx="48" cy="50" r="22" fill="#bf4636"/>
    <text x="40" y="58" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#ffffff">6</text>
    <text x="86" y="54" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#10352f">Market access</text>
    <text x="38" y="100" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">Destination-market product</text>
    <text x="38" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">listing, responsible person,</text>
    <text x="38" y="160" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#40504c">claims, and marketplace policy.</text>
  </g>

  <path d="M452 323 H520" stroke="#6a7b76" stroke-width="5" stroke-linecap="round"/>
  <path d="M880 323 H948" stroke="#6a7b76" stroke-width="5" stroke-linecap="round"/>
  <path d="M272 412 V470" stroke="#6a7b76" stroke-width="5" stroke-linecap="round"/>
  <path d="M700 412 V470" stroke="#6a7b76" stroke-width="5" stroke-linecap="round"/>
  <path d="M1128 412 V470" stroke="#6a7b76" stroke-width="5" stroke-linecap="round"/>

  <rect x="92" y="698" width="1216" height="62" rx="20" fill="#10352f"/>
  <text x="126" y="738" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Rule of thumb: a low price without authorization and batch proof is not a wholesale advantage. It is unpriced risk.</text>
</svg>
