<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Korea supplier verification checklist</title>
  <desc id="desc">A checklist for verifying Korean suppliers by identity, export readiness, product evidence, certificates, samples, and payment safeguards.</desc>
  <rect width="1200" height="675" fill="#f9fafb"/>
  <rect x="64" y="54" width="1072" height="566" rx="22" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="102" y="122" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">Supplier Verification Checklist</text>
  <text x="102" y="163" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">Do these checks before deposits, exclusivity, or large purchase orders.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22">
    <g transform="translate(105 220)">
      <rect width="300" height="78" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text x="58" y="50" fill="#065f46" font-weight="800">01</text>
      <text x="105" y="50" fill="#064e3b" font-weight="700">Company identity</text>
    </g>
    <g transform="translate(450 220)">
      <rect width="300" height="78" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="58" y="50" fill="#1d4ed8" font-weight="800">02</text>
      <text x="105" y="50" fill="#1e3a8a" font-weight="700">Export readiness</text>
    </g>
    <g transform="translate(795 220)">
      <rect width="300" height="78" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
      <text x="58" y="50" fill="#c2410c" font-weight="800">03</text>
      <text x="105" y="50" fill="#7c2d12" font-weight="700">Product evidence</text>
    </g>
    <g transform="translate(105 340)">
      <rect width="300" height="78" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <text x="58" y="50" fill="#b91c1c" font-weight="800">04</text>
      <text x="105" y="50" fill="#7f1d1d" font-weight="700">Certificates</text>
    </g>
    <g transform="translate(450 340)">
      <rect width="300" height="78" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="58" y="50" fill="#6d28d9" font-weight="800">05</text>
      <text x="105" y="50" fill="#4c1d95" font-weight="700">Sample controls</text>
    </g>
    <g transform="translate(795 340)">
      <rect width="300" height="78" rx="14" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
      <text x="58" y="50" fill="#0f766e" font-weight="800">06</text>
      <text x="105" y="50" fill="#134e4a" font-weight="700">Payment safeguards</text>
    </g>
  </g>
  <rect x="104" y="480" width="992" height="72" rx="16" fill="#111827"/>
  <text x="600" y="525" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800">Platform listing + documents + sample performance = stronger buyer signal</text>
  <text x="104" y="586" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="17">EpicKor Business Editor | Verification visual</text>
</svg>
