<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Korea supplier discovery workflow</title>
  <desc id="desc">A business infographic showing the path from product scope to Korea supplier platforms, verification, first contact, samples, and purchase order.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="60" y="56" width="1080" height="563" rx="22" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="100" y="124" fill="#0f172a" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">Korea Supplier Discovery Map</text>
  <text x="100" y="164" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="21">Use official paths, then verify before samples or payment.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(95 225)">
      <rect width="160" height="132" rx="16" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
      <text x="80" y="42" text-anchor="middle" fill="#065f46" font-size="20" font-weight="800">1. Scope</text>
      <text x="80" y="76" text-anchor="middle" fill="#064e3b" font-size="16">product</text>
      <text x="80" y="100" text-anchor="middle" fill="#064e3b" font-size="16">role</text>
    </g>
    <path d="M270 291 H330" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M330 291 l-16 -10 v20z" fill="#94a3b8"/>
    <g transform="translate(345 225)">
      <rect width="190" height="132" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="95" y="42" text-anchor="middle" fill="#1d4ed8" font-size="20" font-weight="800">2. Search</text>
      <text x="95" y="76" text-anchor="middle" fill="#1e3a8a" font-size="16">KOTRA</text>
      <text x="95" y="100" text-anchor="middle" fill="#1e3a8a" font-size="16">buyKOREA</text>
    </g>
    <path d="M550 291 H610" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M610 291 l-16 -10 v20z" fill="#94a3b8"/>
    <g transform="translate(625 225)">
      <rect width="190" height="132" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
      <text x="95" y="42" text-anchor="middle" fill="#c2410c" font-size="20" font-weight="800">3. Compare</text>
      <text x="95" y="76" text-anchor="middle" fill="#7c2d12" font-size="16">tradeKorea</text>
      <text x="95" y="100" text-anchor="middle" fill="#7c2d12" font-size="16">GobizKOREA</text>
    </g>
    <path d="M830 291 H890" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <path d="M890 291 l-16 -10 v20z" fill="#94a3b8"/>
    <g transform="translate(905 225)">
      <rect width="200" height="132" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
      <text x="100" y="42" text-anchor="middle" fill="#b91c1c" font-size="20" font-weight="800">4. Verify</text>
      <text x="100" y="76" text-anchor="middle" fill="#7f1d1d" font-size="16">company</text>
      <text x="100" y="100" text-anchor="middle" fill="#7f1d1d" font-size="16">documents</text>
    </g>
    <g transform="translate(220 430)">
      <rect width="250" height="104" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="125" y="42" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800">First Contact</text>
      <text x="125" y="72" text-anchor="middle" fill="#475569" font-size="16">clear RFQ + buyer profile</text>
    </g>
    <g transform="translate(490 430)">
      <rect width="250" height="104" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="125" y="42" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800">Sample Test</text>
      <text x="125" y="72" text-anchor="middle" fill="#475569" font-size="16">version + quality control</text>
    </g>
    <g transform="translate(760 430)">
      <rect width="250" height="104" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
      <text x="125" y="42" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800">PO Decision</text>
      <text x="125" y="72" text-anchor="middle" fill="#475569" font-size="16">terms + compliance review</text>
    </g>
  </g>
  <text x="100" y="585" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="17">EpicKor Business Editor | Operator guide visual</text>
</svg>
