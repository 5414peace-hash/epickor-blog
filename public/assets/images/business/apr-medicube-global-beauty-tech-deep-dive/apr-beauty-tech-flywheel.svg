<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">APR beauty-tech flywheel</title>
  <desc id="desc">An editorial diagram showing how direct customer relationships, skincare products, beauty devices, global distribution, and customer feedback reinforce one another.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#27364f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="82" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="48" font-weight="700">APR's beauty-tech flywheel</text>
  <text x="800" y="126" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="23">A useful operating model—not a claim that every step is owned or risk-free</text>
  <g fill="none" stroke="#7dd3fc" stroke-width="10" stroke-linecap="round" opacity=".85"><path d="M485 274 C650 145 950 145 1115 274"/><path d="M1240 360 C1352 495 1285 678 1110 755"/><path d="M975 794 C755 865 520 790 426 650"/><path d="M348 555 C305 421 355 318 485 274"/></g>
  <g fill="#7dd3fc"><path d="M1095 249 l55 8 -28 48z"/><path d="M1126 733 l-4 56 -47-31z"/><path d="M457 629 l-23 52 -35-44z"/><path d="M463 299 l-55 -6 27 -49z"/></g>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <g><rect x="175" y="210" width="410" height="155" rx="28" fill="#fff"/><text x="380" y="267" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="700">D2C reach</text><text x="380" y="309" text-anchor="middle" fill="#475569" font-size="21">Content, ecommerce and</text><text x="380" y="338" text-anchor="middle" fill="#475569" font-size="21">first-party customer signals</text></g>
    <g><rect x="1015" y="210" width="410" height="155" rx="28" fill="#fff"/><text x="1220" y="267" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="700">Skincare products</text><text x="1220" y="309" text-anchor="middle" fill="#475569" font-size="21">Repeat-use cosmetics and</text><text x="1220" y="338" text-anchor="middle" fill="#475569" font-size="21">hero-product discovery</text></g>
    <g><rect x="1015" y="570" width="410" height="155" rx="28" fill="#fff"/><text x="1220" y="627" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="700">Beauty devices</text><text x="1220" y="669" text-anchor="middle" fill="#475569" font-size="21">Higher-ticket tools, routines</text><text x="1220" y="698" text-anchor="middle" fill="#475569" font-size="21">and after-sales obligations</text></g>
    <g><rect x="175" y="570" width="410" height="155" rx="28" fill="#fff"/><text x="380" y="627" text-anchor="middle" fill="#0f172a" font-size="30" font-weight="700">Global channels</text><text x="380" y="669" text-anchor="middle" fill="#475569" font-size="21">Local sites, marketplaces,</text><text x="380" y="698" text-anchor="middle" fill="#475569" font-size="21">retail and logistics</text></g>
    <circle cx="800" cy="466" r="142" fill="#f472b6"/><text x="800" y="449" text-anchor="middle" fill="#fff" font-size="36" font-weight="700">Feedback loop</text><text x="800" y="489" text-anchor="middle" fill="#fff" font-size="21">Demand signals guide</text><text x="800" y="519" text-anchor="middle" fill="#fff" font-size="21">product and channel choices</text>
  </g>
  <text x="800" y="856" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="20">EPICKOR.COM · editorial interpretation based on APR public materials</text>
</svg>
