<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Buyer meeting scorecard</title>
  <desc id="desc">A scorecard for evaluating Korean trade-show booth meetings by fit, evidence, export readiness, documents, communication, and next steps.</desc>
  <rect width="1200" height="675" fill="#f9fafb"/>
  <rect x="64" y="54" width="1072" height="566" rx="22" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <text x="102" y="122" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">Buyer Meeting Scorecard</text>
  <text x="102" y="163" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="21">Use the same scoring logic for every booth so excitement does not distort the shortlist.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(120 222)">
      <rect width="960" height="58" rx="12" fill="#0f172a"/>
      <text x="35" y="37" fill="#ffffff" font-size="19" font-weight="800">Signal</text>
      <text x="330" y="37" fill="#ffffff" font-size="19" font-weight="800">Evidence</text>
      <text x="655" y="37" fill="#ffffff" font-size="19" font-weight="800">Next step</text>
    </g>
    <g transform="translate(120 292)" font-size="19">
      <rect width="960" height="52" fill="#ecfdf5"/>
      <text x="35" y="34" fill="#064e3b" font-weight="800">Product fit</text>
      <text x="330" y="34" fill="#064e3b">exact category examples</text>
      <text x="655" y="34" fill="#064e3b">request SKU detail</text>
    </g>
    <g transform="translate(120 352)" font-size="19">
      <rect width="960" height="52" fill="#eff6ff"/>
      <text x="35" y="34" fill="#1e3a8a" font-weight="800">Export readiness</text>
      <text x="330" y="34" fill="#1e3a8a">documents + markets</text>
      <text x="655" y="34" fill="#1e3a8a">ask for examples</text>
    </g>
    <g transform="translate(120 412)" font-size="19">
      <rect width="960" height="52" fill="#fff7ed"/>
      <text x="35" y="34" fill="#7c2d12" font-weight="800">Sample control</text>
      <text x="330" y="34" fill="#7c2d12">version + label</text>
      <text x="655" y="34" fill="#7c2d12">log sample ID</text>
    </g>
    <g transform="translate(120 472)" font-size="19">
      <rect width="960" height="52" fill="#fef2f2"/>
      <text x="35" y="34" fill="#7f1d1d" font-weight="800">Commercial clarity</text>
      <text x="330" y="34" fill="#7f1d1d">MOQ + lead time</text>
      <text x="655" y="34" fill="#7f1d1d">move to written quote</text>
    </g>
  </g>
  <text x="104" y="586" fill="#6b7280" font-family="Arial, Helvetica, sans-serif" font-size="17">EpicKor Business Editor | Trade-show buyer visual</text>
</svg>
