<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">MUSINSA channel map</title>
  <desc id="desc">A channel map showing the MUSINSA ecosystem across platform, brand, offline store, global store, and partner-brand infrastructure.</desc>
  <rect width="1400" height="900" fill="#f3f2ee"/>
  <rect x="90" y="80" width="1220" height="740" rx="34" fill="#ffffff" stroke="#dad7cf" stroke-width="3"/>
  <text x="130" y="152" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#151515">MUSINSA channel map</text>
  <text x="132" y="200" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#64625d">Why the company matters beyond a single shopping app</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="700" cy="450" r="135" fill="#111111"/>
    <text x="610" y="437" font-size="31" font-weight="800" fill="#ffffff">MUSINSA</text>
    <text x="584" y="480" font-size="22" fill="#f5f5f5">fashion platform</text>
    <g fill="#ffffff" stroke="#111111" stroke-width="3">
      <rect x="160" y="250" width="300" height="140" rx="24"/>
      <rect x="940" y="250" width="300" height="140" rx="24"/>
      <rect x="160" y="560" width="300" height="140" rx="24"/>
      <rect x="940" y="560" width="300" height="140" rx="24"/>
    </g>
    <g font-size="24" fill="#111111" font-weight="800">
      <text x="205" y="315">Marketplace</text>
      <text x="985" y="315">Private Label</text>
      <text x="205" y="625">Offline Retail</text>
      <text x="985" y="625">Global Growth</text>
    </g>
    <g font-size="20" fill="#5c5a55">
      <text x="205" y="354">Partner brands and</text>
      <text x="205" y="382">customer discovery</text>
      <text x="985" y="354">MUSINSA Standard</text>
      <text x="985" y="382">margin and fit data</text>
      <text x="205" y="664">Seongsu, Myeongdong,</text>
      <text x="205" y="692">Hongdae and more</text>
      <text x="985" y="664">Japan, China, global store,</text>
      <text x="985" y="692">exports and tourism</text>
    </g>
    <g stroke="#8e8b83" stroke-width="5" stroke-linecap="round">
      <line x1="460" y1="330" x2="585" y2="405"/>
      <line x1="940" y1="330" x2="815" y2="405"/>
      <line x1="460" y1="630" x2="585" y2="505"/>
      <line x1="940" y1="630" x2="815" y2="505"/>
    </g>
  </g>
</svg>
