<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">MUSINSA growth map</title>
  <desc id="desc">A business infographic showing MUSINSA's path from fashion community to platform, private label, offline retail, and global expansion.</desc>
  <rect width="1400" height="900" fill="#f7f7f3"/>
  <rect x="78" y="80" width="1244" height="740" rx="34" fill="#ffffff" stroke="#d7d5cd" stroke-width="3"/>
  <text x="126" y="152" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#171717">MUSINSA growth map</text>
  <text x="128" y="200" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#69675f">From community energy to a fashion operating system</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <line x1="180" y1="420" x2="1220" y2="420" stroke="#111111" stroke-width="7" stroke-linecap="round"/>
    <circle cx="210" cy="420" r="26" fill="#111111"/>
    <text x="160" y="500" font-size="26" font-weight="800" fill="#111111">2001</text>
    <text x="126" y="540" font-size="21" fill="#55534e">Sneaker photo</text>
    <text x="126" y="570" font-size="21" fill="#55534e">community origin</text>
    <circle cx="450" cy="420" r="26" fill="#111111"/>
    <text x="405" y="320" font-size="26" font-weight="800" fill="#111111">2009</text>
    <text x="354" y="360" font-size="21" fill="#55534e">Commerce layer</text>
    <text x="354" y="390" font-size="21" fill="#55534e">starts scaling</text>
    <circle cx="690" cy="420" r="26" fill="#111111"/>
    <text x="645" y="500" font-size="26" font-weight="800" fill="#111111">2017</text>
    <text x="594" y="540" font-size="21" fill="#55534e">MUSINSA Standard</text>
    <text x="594" y="570" font-size="21" fill="#55534e">private-label lever</text>
    <circle cx="930" cy="420" r="26" fill="#111111"/>
    <text x="885" y="320" font-size="26" font-weight="800" fill="#111111">2021-22</text>
    <text x="820" y="360" font-size="21" fill="#55534e">29CM acquisition</text>
    <text x="820" y="390" font-size="21" fill="#55534e">global service launch</text>
    <circle cx="1170" cy="420" r="26" fill="#111111"/>
    <text x="1125" y="500" font-size="26" font-weight="800" fill="#111111">2024-26</text>
    <text x="1064" y="540" font-size="21" fill="#55534e">Offline stores</text>
    <text x="1064" y="570" font-size="21" fill="#55534e">global and export push</text>
  </g>
  <rect x="150" y="680" width="1100" height="70" rx="22" fill="#111111"/>
  <text x="190" y="725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Deep-dive lens:</text>
  <text x="394" y="725" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#eeeae1">MUSINSA is a marketplace, brand builder, retail operator, and K-fashion export channel.</text>
</svg>
