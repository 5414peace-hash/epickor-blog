<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Korean beauty device decision map</title>
  <desc id="desc">A neutral infographic comparing LED masks, microcurrent, EMS, and absorption-focused skincare devices.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="70" y="70" width="1060" height="620" rx="28" fill="#ffffff" stroke="#d7dee8" stroke-width="3"/>
  <text x="110" y="138" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">K-Beauty Device Buying Logic</text>
  <text x="110" y="178" font-family="Arial, sans-serif" font-size="22" fill="#5b6472">Buy for one repeatable job, not every viral promise at once.</text>
  <g transform="translate(115 245)">
    <rect width="230" height="255" rx="18" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
    <text x="28" y="55" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#991b1b">LED</text>
    <text x="28" y="93" font-family="Arial, sans-serif" font-size="20" fill="#7f1d1d">Light-based routine</text>
    <text x="28" y="142" font-family="Arial, sans-serif" font-size="18" fill="#475569">Best if you can use it</text>
    <text x="28" y="170" font-family="Arial, sans-serif" font-size="18" fill="#475569">consistently and safely.</text>
  </g>
  <g transform="translate(370 245)">
    <rect width="230" height="255" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="28" y="55" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#1d4ed8">Microcurrent</text>
    <text x="28" y="93" font-family="Arial, sans-serif" font-size="20" fill="#1e3a8a">Lift-feel category</text>
    <text x="28" y="142" font-family="Arial, sans-serif" font-size="18" fill="#475569">Needs slip, patience,</text>
    <text x="28" y="170" font-family="Arial, sans-serif" font-size="18" fill="#475569">and low intensity first.</text>
  </g>
  <g transform="translate(625 245)">
    <rect width="230" height="255" rx="18" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="28" y="55" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#166534">EMS</text>
    <text x="28" y="93" font-family="Arial, sans-serif" font-size="20" fill="#14532d">Muscle stimulation</text>
    <text x="28" y="142" font-family="Arial, sans-serif" font-size="18" fill="#475569">Interesting, but not for</text>
    <text x="28" y="170" font-family="Arial, sans-serif" font-size="18" fill="#475569">everyone's comfort level.</text>
  </g>
  <g transform="translate(880 245)">
    <rect width="230" height="255" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="28" y="55" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#9a3412">Boosters</text>
    <text x="28" y="93" font-family="Arial, sans-serif" font-size="20" fill="#7c2d12">Absorption-focused</text>
    <text x="28" y="142" font-family="Arial, sans-serif" font-size="18" fill="#475569">Pair with gentle serums,</text>
    <text x="28" y="170" font-family="Arial, sans-serif" font-size="18" fill="#475569">not harsh actives.</text>
  </g>
  <g transform="translate(120 570)">
    <circle cx="20" cy="20" r="13" fill="#0f766e"/>
    <text x="48" y="27" font-family="Arial, sans-serif" font-size="22" fill="#334155">Check contraindications, start low, and stop if heat, pain, or irritation appears.</text>
  </g>
  <g transform="translate(120 620)">
    <circle cx="20" cy="20" r="13" fill="#b45309"/>
    <text x="48" y="27" font-family="Arial, sans-serif" font-size="22" fill="#334155">A device is a habit purchase. If you will not repeat it, it is just expensive clutter.</text>
  </g>
</svg>
