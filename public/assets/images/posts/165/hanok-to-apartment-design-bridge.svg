<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Hanok to apartment design bridge</title>
  <desc id="desc">A visual bridge from hanok principles to modern Korean apartment interiors.</desc>
  <rect width="1200" height="800" fill="#ecfdf5"/>
  <text x="600" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="50" font-weight="800" fill="#14532d">HANOK → APARTMENT</text>
  <g font-family="Arial,sans-serif" fill="#14532d">
    <rect x="125" y="250" width="280" height="300" rx="34" fill="#fff"/><text x="265" y="350" text-anchor="middle" font-size="34" font-weight="800">Floor life</text><text x="265" y="410" text-anchor="middle" font-size="24">ondol comfort</text>
    <rect x="460" y="250" width="280" height="300" rx="34" fill="#fff"/><text x="600" y="350" text-anchor="middle" font-size="34" font-weight="800">Natural light</text><text x="600" y="410" text-anchor="middle" font-size="24">soft filtering</text>
    <rect x="795" y="250" width="280" height="300" rx="34" fill="#fff"/><text x="935" y="350" text-anchor="middle" font-size="34" font-weight="800">Flexible room</text><text x="935" y="410" text-anchor="middle" font-size="24">less clutter</text>
  </g>
  <text x="600" y="665" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#166534">Modern K-living borrows principles, not museum replicas.</text>
</svg>
