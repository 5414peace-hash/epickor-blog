<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Small Korean apartment zone plan</title>
  <desc id="desc">A simplified small apartment plan for Korean warm minimalism.</desc>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <rect x="170" y="110" width="860" height="580" rx="30" fill="#fff" stroke="#94a3b8" stroke-width="8"/>
  <line x1="170" y1="340" x2="1030" y2="340" stroke="#94a3b8" stroke-width="6"/>
  <line x1="600" y1="340" x2="600" y2="690" stroke="#94a3b8" stroke-width="6"/>
  <text x="600" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="44" font-weight="800" fill="#334155">SMALL SPACE, CLEAR ZONES</text>
  <g font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#475569">
    <text x="385" y="285" text-anchor="middle">light + storage wall</text>
    <text x="815" y="285" text-anchor="middle">work / vanity</text>
    <text x="385" y="535" text-anchor="middle">floor table</text>
    <text x="815" y="535" text-anchor="middle">soft seating</text>
  </g>
</svg>
