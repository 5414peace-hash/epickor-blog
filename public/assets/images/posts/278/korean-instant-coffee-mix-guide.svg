<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Korean instant coffee mix guide</title>
  <desc id="desc">Editorial graphic showing Korean instant coffee mix sticks, a paper cup, hot water, and a small snack.</desc>
  <rect width="1200" height="675" fill="#f4eadc"/>
  <rect x="70" y="70" width="1060" height="535" rx="30" fill="#fffaf2" stroke="#151515" stroke-width="4"/>
  <text x="112" y="132" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#151515">Korean instant coffee mix</text>
  <text x="114" y="171" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5b4636">One stick, hot water, a tiny pause, and a very Korean office rhythm.</text>

  <rect x="145" y="240" width="135" height="285" rx="22" fill="#c79a5b" stroke="#151515" stroke-width="4"/>
  <rect x="168" y="276" width="88" height="56" rx="10" fill="#fffaf2"/>
  <text x="176" y="311" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#151515">MIX</text>
  <text x="171" y="378" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fffaf2">classic</text>
  <text x="171" y="405" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fffaf2">sweet</text>

  <rect x="330" y="232" width="110" height="300" rx="16" fill="#f9d56e" stroke="#151515" stroke-width="4"/>
  <text x="358" y="305" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#151515">stick</text>
  <line x1="355" y1="338" x2="415" y2="338" stroke="#151515" stroke-width="3"/>
  <line x1="355" y1="372" x2="415" y2="372" stroke="#151515" stroke-width="3"/>
  <line x1="355" y1="406" x2="415" y2="406" stroke="#151515" stroke-width="3"/>

  <path d="M532 294 h220 l-30 210 h-160 z" fill="#ffffff" stroke="#151515" stroke-width="4"/>
  <ellipse cx="642" cy="294" rx="110" ry="28" fill="#ffffff" stroke="#151515" stroke-width="4"/>
  <ellipse cx="642" cy="326" rx="84" ry="18" fill="#7b4a2a"/>
  <path d="M790 342 c58 0 58 105 0 105 h-42 v-36 h37 c18 0 18-33 0-33 h-31 v-36z" fill="#ffffff" stroke="#151515" stroke-width="4"/>
  <text x="579" y="423" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#151515">small cup</text>

  <path d="M844 242 c18 -38 65 -38 82 0 c13 30 -3 62 -41 82 c-38 -20 -54 -52 -41 -82z" fill="#b36b2c" stroke="#151515" stroke-width="4"/>
  <text x="820" y="376" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#151515">yakgwa</text>
  <text x="814" y="409" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5b4636">snack pairing</text>

  <rect x="140" y="545" width="920" height="38" rx="19" fill="#151515"/>
  <text x="173" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#fffaf2">Rule: taste a small pack first. Reorder the ritual, not just the packaging.</text>
  <text x="962" y="632" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#151515">EPICKOR.COM</text>
</svg>
