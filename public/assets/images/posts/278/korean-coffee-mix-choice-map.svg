<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Korean coffee mix choice map</title>
  <desc id="desc">Decision map for choosing Korean coffee mix by moment: classic sweet, white gold, black instant, latte, and gift pairing.</desc>
  <rect width="1200" height="675" fill="#f7f2ea"/>
  <rect x="76" y="62" width="1048" height="552" rx="26" fill="#ffffff" stroke="#111111" stroke-width="4"/>
  <text x="118" y="123" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#111111">Choose by coffee moment</text>
  <text x="120" y="160" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#555555">Korean coffee mix is about timing as much as flavor.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="125" y="220" width="190" height="108" rx="18" fill="#f8c471" stroke="#111111" stroke-width="3"/>
    <text x="150" y="260" font-size="23" font-weight="700" fill="#111111">classic</text>
    <text x="150" y="292" font-size="17" fill="#333333">office reset</text>

    <rect x="365" y="220" width="190" height="108" rx="18" fill="#fff2c7" stroke="#111111" stroke-width="3"/>
    <text x="390" y="260" font-size="23" font-weight="700" fill="#111111">white gold</text>
    <text x="390" y="292" font-size="17" fill="#333333">soft sweet cup</text>

    <rect x="605" y="220" width="190" height="108" rx="18" fill="#d9d2c5" stroke="#111111" stroke-width="3"/>
    <text x="630" y="260" font-size="23" font-weight="700" fill="#111111">black stick</text>
    <text x="630" y="292" font-size="17" fill="#333333">less sugar</text>

    <rect x="845" y="220" width="190" height="108" rx="18" fill="#ead7ff" stroke="#111111" stroke-width="3"/>
    <text x="870" y="260" font-size="23" font-weight="700" fill="#111111">latte</text>
    <text x="870" y="292" font-size="17" fill="#333333">dessert break</text>

    <rect x="210" y="408" width="310" height="94" rx="18" fill="#dff4e8" stroke="#111111" stroke-width="3"/>
    <text x="238" y="448" font-size="23" font-weight="700" fill="#111111">gift basket</text>
    <text x="238" y="480" font-size="17" fill="#333333">coffee mix + yakgwa + snack box</text>

    <rect x="650" y="408" width="310" height="94" rx="18" fill="#e1efff" stroke="#111111" stroke-width="3"/>
    <text x="678" y="448" font-size="23" font-weight="700" fill="#111111">desk drawer</text>
    <text x="678" y="480" font-size="17" fill="#333333">small pack before bulk box</text>
  </g>

  <rect x="148" y="548" width="904" height="42" rx="21" fill="#111111"/>
  <text x="183" y="576" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Best beginner move: try classic first, then decide if you want softer, darker, or sweeter.</text>
  <text x="960" y="636" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111111">EPICKOR.COM</text>
</svg>
