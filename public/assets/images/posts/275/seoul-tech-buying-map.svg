<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Seoul tech shopping buying map</title>
  <desc id="desc">An editorial checklist for buying electronics in Seoul, covering warranty, voltage, tax refund, price check, and packability.</desc>
  <rect width="1400" height="900" fill="#f7f8fa"/>
  <rect x="80" y="80" width="1240" height="740" rx="24" fill="#ffffff" stroke="#26313f" stroke-width="4"/>
  <text x="130" y="155" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#1f2937">Seoul Tech Buying Filter</text>
  <text x="130" y="198" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#596273">Good gadget shopping starts before the counter.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="130" y="270" width="250" height="310" rx="18" fill="#e9f2ff" stroke="#7aa7d9" stroke-width="3"/>
    <text x="160" y="325" font-size="30" font-weight="700" fill="#233a55">Buy</text>
    <text x="160" y="380" font-size="24" fill="#40546d">Power banks</text>
    <text x="160" y="420" font-size="24" fill="#40546d">Cables</text>
    <text x="160" y="460" font-size="24" fill="#40546d">Camera straps</text>
    <text x="160" y="500" font-size="24" fill="#40546d">Small storage</text>
    <rect x="440" y="270" width="250" height="310" rx="18" fill="#eef5ea" stroke="#88aa72" stroke-width="3"/>
    <text x="470" y="325" font-size="30" font-weight="700" fill="#314623">Compare</text>
    <text x="470" y="380" font-size="24" fill="#4b6040">Camera bodies</text>
    <text x="470" y="420" font-size="24" fill="#4b6040">Used lenses</text>
    <text x="470" y="460" font-size="24" fill="#4b6040">Audio gear</text>
    <text x="470" y="500" font-size="24" fill="#4b6040">Keyboard parts</text>
    <rect x="750" y="270" width="250" height="310" rx="18" fill="#fff1e6" stroke="#cc8a4b" stroke-width="3"/>
    <text x="780" y="325" font-size="30" font-weight="700" fill="#5a3921">Avoid</text>
    <text x="780" y="380" font-size="24" fill="#6b4e38">No warranty</text>
    <text x="780" y="420" font-size="24" fill="#6b4e38">Mystery voltage</text>
    <text x="780" y="460" font-size="24" fill="#6b4e38">Too bulky</text>
    <text x="780" y="500" font-size="24" fill="#6b4e38">Pressure sales</text>
    <rect x="1060" y="270" width="210" height="310" rx="18" fill="#f4eaf2" stroke="#ad7aa4" stroke-width="3"/>
    <text x="1090" y="325" font-size="30" font-weight="700" fill="#52344d">Ask</text>
    <text x="1090" y="380" font-size="24" fill="#60475d">Receipt?</text>
    <text x="1090" y="420" font-size="24" fill="#60475d">Return?</text>
    <text x="1090" y="460" font-size="24" fill="#60475d">Model no.?</text>
    <text x="1090" y="500" font-size="24" fill="#60475d">Tax refund?</text>
  </g>
  <rect x="130" y="640" width="1140" height="80" rx="16" fill="#26313f"/>
  <text x="170" y="692" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#ffffff">Rule: if the same item is cheaper online at home, Seoul must offer better timing, memory, or service.</text>
  <text x="130" y="775" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#596273">EPICKOR.COM planning graphic</text>
</svg>
