<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Korean practical table tools map</title>
  <desc id="desc">A warm editorial graphic mapping Korean food scissors, tongs, wet tissues, and tableware to everyday use cases.</desc>
  <rect width="1400" height="900" fill="#fff7ed"/>
  <circle cx="1180" cy="140" r="220" fill="#fed7aa" opacity=".65"/>
  <circle cx="160" cy="780" r="260" fill="#fde68a" opacity=".45"/>
  <rect x="90" y="86" width="1220" height="728" rx="52" fill="#ffffff" stroke="#fb923c" stroke-width="6"/>
  <text x="140" y="170" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#9a3412">Korean table tools</text>
  <text x="140" y="220" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#7c2d12">Small tools that make shared meals faster, cleaner, and easier.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="150" y="300" width="500" height="150" rx="28" fill="#ffedd5"/>
    <text x="190" y="356" font-size="34" font-weight="800" fill="#9a3412">Food scissors</text>
    <text x="190" y="398" font-size="24" fill="#7c2d12">BBQ, naengmyeon, kimchi, seafood</text>
    <text x="190" y="430" font-size="22" fill="#9a3412">Cut at the table, share cleanly.</text>
    <rect x="750" y="300" width="500" height="150" rx="28" fill="#fef3c7"/>
    <text x="790" y="356" font-size="34" font-weight="800" fill="#92400e">Tongs</text>
    <text x="790" y="398" font-size="24" fill="#78350f">Grill control and serving</text>
    <text x="790" y="430" font-size="22" fill="#92400e">Keep raw and cooked food organized.</text>
    <rect x="150" y="520" width="500" height="150" rx="28" fill="#ecfeff"/>
    <text x="190" y="576" font-size="34" font-weight="800" fill="#155e75">Wet tissues</text>
    <text x="190" y="618" font-size="24" fill="#164e63">Sauce, smoke, street food, travel</text>
    <text x="190" y="650" font-size="22" fill="#155e75">Tiny item, huge friction remover.</text>
    <rect x="750" y="520" width="500" height="150" rx="28" fill="#f0fdf4"/>
    <text x="790" y="576" font-size="34" font-weight="800" fill="#166534">Spoon + chopsticks</text>
    <text x="790" y="618" font-size="24" fill="#14532d">Rice, soup, banchan, shared dishes</text>
    <text x="790" y="650" font-size="22" fill="#166534">Korean table rhythm in two tools.</text>
  </g>
  <path d="M680 370h56M680 590h56" stroke="#fb923c" stroke-width="10" stroke-linecap="round"/>
  <text x="140" y="755" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#9a3412">EpicKor note: the item is interesting because it solves a real table problem.</text>
</svg>
