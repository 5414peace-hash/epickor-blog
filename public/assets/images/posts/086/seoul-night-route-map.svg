<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Seoul night route map</title>
  <desc id="desc">A stylized EpicKor map showing four Seoul night planning anchors: Hangang, cafe neighborhoods, markets, and transit.</desc>
  <rect width="1200" height="800" fill="#101827"/>
  <circle cx="920" cy="130" r="58" fill="#f8d26a"/>
  <path d="M0 500 C180 430 310 575 480 505 C660 430 790 580 1200 455 L1200 800 L0 800 Z" fill="#183a55"/>
  <path d="M0 560 C210 505 350 625 520 560 C730 480 900 640 1200 520" fill="none" stroke="#4cc9f0" stroke-width="16" opacity=".75"/>
  <g fill="#26364d">
    <rect x="90" y="310" width="90" height="210" rx="8"/>
    <rect x="205" y="250" width="120" height="270" rx="8"/>
    <rect x="355" y="335" width="80" height="185" rx="8"/>
    <rect x="790" y="280" width="95" height="240" rx="8"/>
    <rect x="915" y="230" width="120" height="290" rx="8"/>
  </g>
  <g fill="#f6f7fb" opacity=".85">
    <rect x="115" y="345" width="18" height="18"/><rect x="145" y="345" width="18" height="18"/><rect x="115" y="385" width="18" height="18"/><rect x="145" y="385" width="18" height="18"/>
    <rect x="235" y="285" width="22" height="22"/><rect x="275" y="285" width="22" height="22"/><rect x="235" y="330" width="22" height="22"/><rect x="275" y="330" width="22" height="22"/>
    <rect x="820" y="320" width="20" height="20"/><rect x="850" y="320" width="20" height="20"/><rect x="950" y="275" width="24" height="24"/><rect x="990" y="275" width="24" height="24"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <text x="80" y="105" fill="#ffffff" font-size="54" font-weight="800">SEOUL NIGHT GUIDE</text>
    <text x="82" y="152" fill="#b7c8dc" font-size="25">Choose one anchor, then one nearby backup.</text>
    <g transform="translate(120 610)">
      <rect width="215" height="86" rx="18" fill="#f97316"/>
      <text x="28" y="36" fill="#fff" font-size="24" font-weight="800">HANGANG</text>
      <text x="28" y="66" fill="#fff7ed" font-size="18">river, drones, picnic</text>
    </g>
    <g transform="translate(370 610)">
      <rect width="215" height="86" rx="18" fill="#22c55e"/>
      <text x="28" y="36" fill="#052e16" font-size="24" font-weight="800">CAFES</text>
      <text x="28" y="66" fill="#052e16" font-size="18">Seongsu, Hannam</text>
    </g>
    <g transform="translate(620 610)">
      <rect width="215" height="86" rx="18" fill="#facc15"/>
      <text x="28" y="36" fill="#422006" font-size="24" font-weight="800">MARKETS</text>
      <text x="28" y="66" fill="#422006" font-size="18">snacks, dinner, gifts</text>
    </g>
    <g transform="translate(870 610)">
      <rect width="215" height="86" rx="18" fill="#60a5fa"/>
      <text x="28" y="36" fill="#082f49" font-size="24" font-weight="800">TRANSIT</text>
      <text x="28" y="66" fill="#082f49" font-size="18">last train + taxi</text>
    </g>
    <text x="80" y="750" fill="#8ea7c4" font-size="18">EPICKOR.COM</text>
  </g>
</svg>
