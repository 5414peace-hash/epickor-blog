<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Korean concert preparation map</title>
  <desc id="desc">A concert preparation checklist for lyrics, fan chants, light sticks, venue rules, phone battery, and transport.</desc>
  <rect width="1400" height="900" fill="#f5f3ff"/>
  <rect x="95" y="80" width="1210" height="740" rx="54" fill="#ffffff" stroke="#8b5cf6" stroke-width="6"/>
  <text x="150" y="165" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#4c1d95">Korean concert prep</text>
  <text x="150" y="215" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#6d28d9">Small prep makes the show feel bigger, not more stressful.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">
    <rect x="160" y="305" width="330" height="115" rx="26" fill="#ede9fe"/>
    <text x="210" y="375" fill="#5b21b6">Lyrics</text>
    <rect x="535" y="305" width="330" height="115" rx="26" fill="#e0f2fe"/>
    <text x="585" y="375" fill="#075985">Fan chant</text>
    <rect x="910" y="305" width="330" height="115" rx="26" fill="#fce7f3"/>
    <text x="960" y="375" fill="#9d174d">Light stick</text>
    <rect x="160" y="520" width="330" height="115" rx="26" fill="#dcfce7"/>
    <text x="210" y="590" fill="#166534">Venue rules</text>
    <rect x="535" y="520" width="330" height="115" rx="26" fill="#fef3c7"/>
    <text x="585" y="590" fill="#92400e">Phone battery</text>
    <rect x="910" y="520" width="330" height="115" rx="26" fill="#fee2e2"/>
    <text x="960" y="590" fill="#991b1b">Exit route</text>
  </g>
  <text x="150" y="755" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#6d28d9">Learn the chorus. Follow the crowd. Get home without panic.</text>
</svg>
