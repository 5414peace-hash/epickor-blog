<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">San-nakji safety checklist</title>
  <desc id="desc">A simple EpicKor checklist reminding travelers to eat san-nakji slowly and chew thoroughly.</desc>
  <rect width="1200" height="800" fill="#eef7f4"/>
  <rect x="110" y="95" width="980" height="610" rx="48" fill="#ffffff" stroke="#0f3f3a" stroke-width="8"/>
  <text x="600" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="900" fill="#0f3f3a">SAN-NAKJI SAFETY</text>
  <text x="600" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#47635f">Fresh seafood is optional. Careful chewing is not.</text>
  <g font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#163f3a">
    <g transform="translate(210 300)">
      <circle cx="0" cy="0" r="28" fill="#16a34a"/>
      <text x="-10" y="12" fill="#fff">✓</text>
      <text x="55" y="12">Small pieces</text>
    </g>
    <g transform="translate(210 385)">
      <circle cx="0" cy="0" r="28" fill="#16a34a"/>
      <text x="-10" y="12" fill="#fff">✓</text>
      <text x="55" y="12">Chew thoroughly</text>
    </g>
    <g transform="translate(210 470)">
      <circle cx="0" cy="0" r="28" fill="#16a34a"/>
      <text x="-10" y="12" fill="#fff">✓</text>
      <text x="55" y="12">Stay seated</text>
    </g>
    <g transform="translate(660 300)">
      <circle cx="0" cy="0" r="28" fill="#dc2626"/>
      <text x="-11" y="12" fill="#fff">!</text>
      <text x="55" y="12">Do not rush</text>
    </g>
    <g transform="translate(660 385)">
      <circle cx="0" cy="0" r="28" fill="#dc2626"/>
      <text x="-11" y="12" fill="#fff">!</text>
      <text x="55" y="12">Avoid when drunk</text>
    </g>
    <g transform="translate(660 470)">
      <circle cx="0" cy="0" r="28" fill="#dc2626"/>
      <text x="-11" y="12" fill="#fff">!</text>
      <text x="55" y="12">Skip if swallowing is hard</text>
    </g>
  </g>
  <text x="600" y="630" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#4b5563">Ask staff to cut it smaller if you are trying it for the first time.</text>
</svg>
