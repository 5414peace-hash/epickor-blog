<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Summer K-pop playlist signal map</title>
  <desc id="desc">An editorial graphic showing timing, chorus, dance, public space, and nostalgia as signals for Korean summer K-pop hits.</desc>
  <rect width="1200" height="800" fill="#eef8ff"/>
  <circle cx="1010" cy="145" r="110" fill="#ffd45a" opacity=".7"/>
  <circle cx="170" cy="650" r="145" fill="#7ed7ff" opacity=".5"/>
  <text x="82" y="100" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1661a5">EPICKOR K-POP GUIDE</text>
  <text x="82" y="172" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#10223a">What makes a</text>
  <text x="82" y="236" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#10223a">summer hit?</text>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <circle cx="600" cy="435" r="104" fill="#ffffff" stroke="#10223a" stroke-width="7"/>
    <text x="600" y="418" font-size="31" font-weight="800" fill="#10223a">Seasonal</text>
    <text x="600" y="458" font-size="31" font-weight="800" fill="#10223a">memory</text>
    <g fill="#ffffff" stroke="#3aa8d8" stroke-width="5">
      <rect x="160" y="330" width="190" height="116" rx="26"/>
      <rect x="425" y="230" width="190" height="116" rx="26"/>
      <rect x="690" y="230" width="190" height="116" rx="26"/>
      <rect x="850" y="430" width="190" height="116" rx="26"/>
      <rect x="425" y="560" width="190" height="116" rx="26"/>
    </g>
    <g fill="#10223a" font-weight="800" font-size="25">
      <text x="255" y="377">Timing</text>
      <text x="520" y="277">Chorus</text>
      <text x="785" y="277">Dance</text>
      <text x="945" y="477">Public space</text>
      <text x="520" y="607">Nostalgia</text>
    </g>
    <g fill="#4c5b6c" font-size="19">
      <text x="255" y="409">May to July</text>
      <text x="520" y="309">repeatable hook</text>
      <text x="785" y="309">easy visual point</text>
      <text x="945" y="509">cafe · gym · festival</text>
      <text x="520" y="639">returns every year</text>
    </g>
  </g>
  <text x="82" y="746" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#1661a5">A true Korean summer song follows people outside the app.</text>
</svg>
