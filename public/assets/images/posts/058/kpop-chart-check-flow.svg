<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">K-pop summer chart check flow</title>
  <desc id="desc">A simple editorial flow for checking Korean summer K-pop momentum across charts, stages, public spaces, and replay value.</desc>
  <rect width="1200" height="800" fill="#17182b"/>
  <rect x="70" y="70" width="1060" height="660" rx="42" fill="#fffaf0"/>
  <text x="115" y="145" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#7250c8">EPICKOR LISTENING FLOW</text>
  <text x="115" y="214" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#191a2e">Check the hit, not just the hype</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="115" y="325" width="205" height="170" rx="28" fill="#ffffff" stroke="#7250c8" stroke-width="5"/>
    <rect x="365" y="325" width="205" height="170" rx="28" fill="#ffffff" stroke="#7250c8" stroke-width="5"/>
    <rect x="615" y="325" width="205" height="170" rx="28" fill="#ffffff" stroke="#7250c8" stroke-width="5"/>
    <rect x="865" y="325" width="205" height="170" rx="28" fill="#ffffff" stroke="#7250c8" stroke-width="5"/>
    <text x="155" y="375" font-size="29" font-weight="800" fill="#191a2e">1. Charts</text>
    <text x="155" y="419" font-size="22" fill="#52536a">Circle Chart</text>
    <text x="155" y="451" font-size="22" fill="#52536a">Billboard Korea</text>
    <text x="405" y="375" font-size="29" font-weight="800" fill="#191a2e">2. Stages</text>
    <text x="405" y="419" font-size="22" fill="#52536a">music shows</text>
    <text x="405" y="451" font-size="22" fill="#52536a">dance practice</text>
    <text x="655" y="375" font-size="29" font-weight="800" fill="#191a2e">3. Public</text>
    <text x="655" y="419" font-size="22" fill="#52536a">cafes · gyms</text>
    <text x="655" y="451" font-size="22" fill="#52536a">festivals</text>
    <text x="905" y="375" font-size="29" font-weight="800" fill="#191a2e">4. Replay</text>
    <text x="905" y="419" font-size="22" fill="#52536a">does it survive</text>
    <text x="905" y="451" font-size="22" fill="#52536a">many listens?</text>
    <g stroke="#191a2e" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M325 410h35"/>
      <path d="M575 410h35"/>
      <path d="M825 410h35"/>
    </g>
    <rect x="225" y="575" width="750" height="92" rx="28" fill="#e7ddff"/>
    <text x="275" y="631" font-size="27" font-weight="800" fill="#191a2e">If data and atmosphere agree, it may become a seasonal classic.</text>
  </g>
</svg>
