<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">How to read K-drama actor fee rumors</title>
  <desc id="desc">An EpicKor editorial checklist separating confirmed facts, reported trade claims, and fan speculation about K-drama actor fees.</desc>
  <rect width="1400" height="900" fill="#f8fafc"/>
  <rect x="0" y="0" width="1400" height="210" fill="#111827"/>
  <text x="90" y="92" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="800">How to read actor-fee headlines</text>
  <text x="92" y="150" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="26">Separate verified facts from entertainment-market noise</text>
  <g>
    <rect x="110" y="285" width="360" height="430" rx="30" fill="#ffffff" stroke="#22c55e" stroke-width="8"/>
    <circle cx="170" cy="355" r="28" fill="#22c55e"/>
    <text x="155" y="366" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="800">1</text>
    <text x="220" y="365" fill="#111827" font-family="Arial, sans-serif" font-size="31" font-weight="800">Confirmed</text>
    <text x="150" y="440" fill="#475569" font-family="Arial, sans-serif" font-size="24">Official profile</text>
    <text x="150" y="485" fill="#475569" font-family="Arial, sans-serif" font-size="24">Platform page</text>
    <text x="150" y="530" fill="#475569" font-family="Arial, sans-serif" font-size="24">Awards and cast</text>
    <text x="150" y="575" fill="#475569" font-family="Arial, sans-serif" font-size="24">Release status</text>
  </g>
  <g>
    <rect x="520" y="285" width="360" height="430" rx="30" fill="#ffffff" stroke="#f59e0b" stroke-width="8"/>
    <circle cx="580" cy="355" r="28" fill="#f59e0b"/>
    <text x="565" y="366" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="800">2</text>
    <text x="630" y="365" fill="#111827" font-family="Arial, sans-serif" font-size="31" font-weight="800">Reported</text>
    <text x="560" y="440" fill="#475569" font-family="Arial, sans-serif" font-size="24">Trade reporting</text>
    <text x="560" y="485" fill="#475569" font-family="Arial, sans-serif" font-size="24">Budget estimates</text>
    <text x="560" y="530" fill="#475569" font-family="Arial, sans-serif" font-size="24">Agency responses</text>
    <text x="560" y="575" fill="#475569" font-family="Arial, sans-serif" font-size="24">Context needed</text>
  </g>
  <g>
    <rect x="930" y="285" width="360" height="430" rx="30" fill="#ffffff" stroke="#ef4444" stroke-width="8"/>
    <circle cx="990" cy="355" r="28" fill="#ef4444"/>
    <text x="975" y="366" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="800">3</text>
    <text x="1040" y="365" fill="#111827" font-family="Arial, sans-serif" font-size="31" font-weight="800">Speculative</text>
    <text x="970" y="440" fill="#475569" font-family="Arial, sans-serif" font-size="24">Anonymous claims</text>
    <text x="970" y="485" fill="#475569" font-family="Arial, sans-serif" font-size="24">Viral screenshots</text>
    <text x="970" y="530" fill="#475569" font-family="Arial, sans-serif" font-size="24">Currency confusion</text>
    <text x="970" y="575" fill="#475569" font-family="Arial, sans-serif" font-size="24">No contract proof</text>
  </g>
  <rect x="185" y="770" width="1030" height="68" rx="34" fill="#111827"/>
  <text x="245" y="814" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">EpicKor rule: use fee rumors to explain the market, not as confirmed salary data.</text>
</svg>
