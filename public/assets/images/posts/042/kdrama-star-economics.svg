<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">K-drama star economics diagram</title>
  <desc id="desc">An EpicKor editorial diagram showing how a top K-drama actor creates value through domestic ratings, global streaming, advertising, and long-tail fandom.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#1e2a44"/>
      <stop offset="1" stop-color="#4a203a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#fff4f7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <circle cx="1190" cy="160" r="170" fill="#ffcf7a" opacity="0.16"/>
  <circle cx="160" cy="730" r="220" fill="#74d8ff" opacity="0.13"/>
  <text x="90" y="105" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="800">Why top K-drama actors cost so much</text>
  <text x="92" y="156" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">A simplified value stack for Hallyu casting decisions</text>
  <g filter="url(#shadow)">
    <rect x="105" y="245" width="270" height="180" rx="28" fill="url(#card)"/>
    <text x="138" y="304" fill="#1f2937" font-family="Arial, sans-serif" font-size="28" font-weight="800">Domestic trust</text>
    <text x="138" y="354" fill="#475569" font-family="Arial, sans-serif" font-size="22">Ratings, press, and</text>
    <text x="138" y="384" fill="#475569" font-family="Arial, sans-serif" font-size="22">family-viewer recall</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="425" y="245" width="270" height="180" rx="28" fill="url(#card)"/>
    <text x="458" y="304" fill="#1f2937" font-family="Arial, sans-serif" font-size="28" font-weight="800">Global pre-sell</text>
    <text x="458" y="354" fill="#475569" font-family="Arial, sans-serif" font-size="22">OTT buyers and</text>
    <text x="458" y="384" fill="#475569" font-family="Arial, sans-serif" font-size="22">regional demand</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="745" y="245" width="270" height="180" rx="28" fill="url(#card)"/>
    <text x="778" y="304" fill="#1f2937" font-family="Arial, sans-serif" font-size="28" font-weight="800">Brand premium</text>
    <text x="778" y="354" fill="#475569" font-family="Arial, sans-serif" font-size="22">Ads, fashion, beauty,</text>
    <text x="778" y="384" fill="#475569" font-family="Arial, sans-serif" font-size="22">and luxury fit</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1065" y="245" width="270" height="180" rx="28" fill="url(#card)"/>
    <text x="1098" y="304" fill="#1f2937" font-family="Arial, sans-serif" font-size="28" font-weight="800">Long tail</text>
    <text x="1098" y="354" fill="#475569" font-family="Arial, sans-serif" font-size="22">Clips, fandom,</text>
    <text x="1098" y="384" fill="#475569" font-family="Arial, sans-serif" font-size="22">rewatches, tourism</text>
  </g>
  <path d="M375 335 H425 M695 335 H745 M1015 335 H1065" stroke="#ffd166" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
  <g filter="url(#shadow)">
    <rect x="305" y="555" width="790" height="190" rx="34" fill="#ffffff" opacity="0.95"/>
    <text x="360" y="625" fill="#111827" font-family="Arial, sans-serif" font-size="34" font-weight="800">Casting fee is not just acting pay</text>
    <text x="360" y="680" fill="#475569" font-family="Arial, sans-serif" font-size="25">It is partly a risk-control expense: a famous lead can make</text>
    <text x="360" y="716" fill="#475569" font-family="Arial, sans-serif" font-size="25">financing, marketing, overseas sales, and platform discovery easier.</text>
  </g>
  <text x="90" y="842" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22">EPICKOR.COM editorial graphic</text>
</svg>
