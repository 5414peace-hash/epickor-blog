<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Seoul character shopping route map</title>
  <desc id="desc">A simple infographic showing a Seoul character shopping route from Kakao Friends and Line Friends to Artbox and blind box stores.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="70" y="70" width="1060" height="620" rx="28" fill="#ffffff" stroke="#d7dee8" stroke-width="3"/>
  <text x="110" y="138" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">Seoul Character Shopping Route</text>
  <text x="110" y="178" font-family="Arial, sans-serif" font-size="22" fill="#5b6472">Separate Korean character IP, stationery gifts, and blind-box collecting.</text>
  <g transform="translate(120 245)">
    <rect width="245" height="260" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <circle cx="58" cy="66" r="28" fill="#f59e0b"/>
    <text x="104" y="72" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#9a3412">Kakao</text>
    <text x="34" y="130" font-family="Arial, sans-serif" font-size="19" fill="#475569">Korean messenger</text>
    <text x="34" y="158" font-family="Arial, sans-serif" font-size="19" fill="#475569">characters and gifts</text>
  </g>
  <g transform="translate(390 245)">
    <rect width="245" height="260" rx="20" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
    <circle cx="58" cy="66" r="28" fill="#22c55e"/>
    <text x="104" y="72" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#166534">LINE</text>
    <text x="34" y="130" font-family="Arial, sans-serif" font-size="19" fill="#475569">Brown, BT21, and</text>
    <text x="34" y="158" font-family="Arial, sans-serif" font-size="19" fill="#475569">photo-zone shopping</text>
  </g>
  <g transform="translate(660 245)">
    <rect width="245" height="260" rx="20" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <circle cx="58" cy="66" r="28" fill="#6366f1"/>
    <text x="104" y="72" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#3730a3">Artbox</text>
    <text x="34" y="130" font-family="Arial, sans-serif" font-size="19" fill="#475569">Stationery, small</text>
    <text x="34" y="158" font-family="Arial, sans-serif" font-size="19" fill="#475569">gifts, and cute tools</text>
  </g>
  <g transform="translate(930 245)">
    <rect width="120" height="260" rx="20" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="2"/>
    <circle cx="60" cy="66" r="28" fill="#ec4899"/>
    <text x="25" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9d174d">Blind</text>
    <text x="26" y="158" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#9d174d">Box</text>
  </g>
  <g transform="translate(120 570)">
    <circle cx="20" cy="20" r="13" fill="#0f766e"/>
    <text x="48" y="27" font-family="Arial, sans-serif" font-size="22" fill="#334155">Buy gifts at the first three. Treat blind boxes as budgeted entertainment.</text>
  </g>
  <g transform="translate(120 620)">
    <circle cx="20" cy="20" r="13" fill="#b45309"/>
    <text x="48" y="27" font-family="Arial, sans-serif" font-size="22" fill="#334155">For resale-heavy items, use official channels and inspect authenticity markers.</text>
  </g>
</svg>
