<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Korean souvenir choice map</title>
  <desc id="desc">A stylized EpicKor decision map for choosing Korean souvenirs by recipient type and packing risk.</desc>
  <rect width="1200" height="800" fill="#fff7ed"/>
  <rect x="72" y="72" width="1056" height="656" rx="34" fill="#ffffff" stroke="#fed7aa" stroke-width="6"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="112" y="145" fill="#9a3412" font-size="50" font-weight="850">KOREAN SOUVENIR MAP</text>
    <text x="114" y="190" fill="#7c2d12" font-size="24">Start with the person, then check weight, rules, and real use.</text>
    <g transform="translate(115 250)">
      <rect width="220" height="150" rx="24" fill="#fef3c7"/>
      <text x="30" y="48" fill="#92400e" font-size="26" font-weight="800">SNACK LOVER</text>
      <text x="30" y="84" fill="#78350f" font-size="20">seaweed, almonds,</text>
      <text x="30" y="112" fill="#78350f" font-size="20">yakgwa, coffee sticks</text>
    </g>
    <g transform="translate(365 250)">
      <rect width="220" height="150" rx="24" fill="#fce7f3"/>
      <text x="30" y="48" fill="#9d174d" font-size="26" font-weight="800">BEAUTY FAN</text>
      <text x="30" y="84" fill="#831843" font-size="20">masks, sunscreen,</text>
      <text x="30" y="112" fill="#831843" font-size="20">travel-size basics</text>
    </g>
    <g transform="translate(615 250)">
      <rect width="220" height="150" rx="24" fill="#dcfce7"/>
      <text x="30" y="48" fill="#166534" font-size="26" font-weight="800">CULTURE GIFT</text>
      <text x="30" y="84" fill="#14532d" font-size="20">hanji, pouch,</text>
      <text x="30" y="112" fill="#14532d" font-size="20">Hangeul stationery</text>
    </g>
    <g transform="translate(865 250)">
      <rect width="220" height="150" rx="24" fill="#dbeafe"/>
      <text x="30" y="48" fill="#1e40af" font-size="26" font-weight="800">PRACTICAL</text>
      <text x="30" y="84" fill="#1e3a8a" font-size="20">light, durable,</text>
      <text x="30" y="112" fill="#1e3a8a" font-size="20">easy to explain</text>
    </g>
    <path d="M220 455 L980 455" stroke="#fdba74" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(180 505)">
      <circle cx="0" cy="0" r="38" fill="#fb923c"/><text x="-17" y="10" fill="#fff" font-size="28" font-weight="800">1</text>
      <text x="58" y="-8" fill="#7c2d12" font-size="24" font-weight="800">Will they use it?</text>
      <text x="58" y="24" fill="#9a3412" font-size="19">Avoid random “Korea” clutter.</text>
    </g>
    <g transform="translate(500 505)">
      <circle cx="0" cy="0" r="38" fill="#fb923c"/><text x="-17" y="10" fill="#fff" font-size="28" font-weight="800">2</text>
      <text x="58" y="-8" fill="#7c2d12" font-size="24" font-weight="800">Will it travel?</text>
      <text x="58" y="24" fill="#9a3412" font-size="19">Check liquids, glass, weight.</text>
    </g>
    <g transform="translate(820 505)">
      <circle cx="0" cy="0" r="38" fill="#fb923c"/><text x="-17" y="10" fill="#fff" font-size="28" font-weight="800">3</text>
      <text x="58" y="-8" fill="#7c2d12" font-size="24" font-weight="800">Any rules?</text>
      <text x="58" y="24" fill="#9a3412" font-size="19">Customs, alcohol, food limits.</text>
    </g>
    <text x="112" y="680" fill="#c2410c" font-size="18" font-weight="700">EPICKOR.COM</text>
  </g>
</svg>
