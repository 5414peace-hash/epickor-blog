<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Korean ramyeon choice map for bag and cup noodles</title>
  <desc id="desc">A simple EpicKor explainer showing when bag ramyeon, cup ramyeon, and Hangang machine ramyeon make sense.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fee2e2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="70" y="70" width="1060" height="660" rx="48" fill="#fff" opacity="0.92"/>
  <text x="600" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="800" fill="#991b1b">KOREAN RAMYEON CHOICE MAP</text>
  <text x="600" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#7f1d1d">Bag, cup, or Hangang machine? Pick by situation, not hype.</text>
  <g font-family="Arial, sans-serif">
    <rect x="115" y="275" width="295" height="320" rx="34" fill="#fee2e2"/>
    <circle cx="263" cy="345" r="50" fill="#dc2626"/>
    <text x="263" y="358" text-anchor="middle" font-size="42" font-weight="800" fill="#fff">BAG</text>
    <text x="263" y="435" text-anchor="middle" font-size="31" font-weight="800" fill="#7f1d1d">Home control</text>
    <text x="263" y="485" text-anchor="middle" font-size="23" fill="#7f1d1d">Egg, scallions, pot</text>
    <text x="263" y="525" text-anchor="middle" font-size="23" fill="#7f1d1d">Best noodle texture</text>
    <text x="263" y="565" text-anchor="middle" font-size="23" fill="#7f1d1d">Easy to customize</text>
    <rect x="452" y="275" width="295" height="320" rx="34" fill="#ffedd5"/>
    <circle cx="600" cy="345" r="50" fill="#f97316"/>
    <text x="600" y="358" text-anchor="middle" font-size="38" font-weight="800" fill="#fff">CUP</text>
    <text x="600" y="435" text-anchor="middle" font-size="31" font-weight="800" fill="#7c2d12">Speed food</text>
    <text x="600" y="485" text-anchor="middle" font-size="23" fill="#7c2d12">Convenience stores</text>
    <text x="600" y="525" text-anchor="middle" font-size="23" fill="#7c2d12">Travel, office, train</text>
    <text x="600" y="565" text-anchor="middle" font-size="23" fill="#7c2d12">No pot needed</text>
    <rect x="789" y="275" width="295" height="320" rx="34" fill="#dcfce7"/>
    <circle cx="937" cy="345" r="50" fill="#16a34a"/>
    <text x="937" y="358" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">PARK</text>
    <text x="937" y="435" text-anchor="middle" font-size="31" font-weight="800" fill="#14532d">Hangang ritual</text>
    <text x="937" y="485" text-anchor="middle" font-size="23" fill="#14532d">Machine cooker</text>
    <text x="937" y="525" text-anchor="middle" font-size="23" fill="#14532d">River view</text>
    <text x="937" y="565" text-anchor="middle" font-size="23" fill="#14532d">Clean up after eating</text>
  </g>
  <text x="600" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#7f1d1d">EpicKor.com · Korea food guide</text>
</svg>
