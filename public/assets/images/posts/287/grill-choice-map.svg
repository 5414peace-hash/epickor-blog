<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Korean BBQ grill choice map for home cooks</title>
  <desc id="desc">A four-option guide comparing electric tabletop grills, stovetop grill pans, butane grill setups, and grill hot-pot combos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171411"/>
      <stop offset="1" stop-color="#33231b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <circle cx="1080" cy="90" r="150" fill="#ef6b35" opacity=".10"/>
  <circle cx="80" cy="630" r="190" fill="#9fcf71" opacity=".08"/>
  <text x="70" y="80" fill="#f6e8da" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">EPICKOR HOME K-BBQ</text>
  <text x="70" y="135" fill="#ffffff" font-family="Arial, sans-serif" font-size="46" font-weight="800">Choose the grill you will use twice</text>
  <text x="70" y="174" fill="#d5c5b8" font-family="Arial, sans-serif" font-size="22">Match the machine to your room, ventilation, cleanup tolerance, and guest count.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="220" width="250" height="280" rx="24" fill="#fff8f0"/>
    <rect x="340" y="220" width="250" height="280" rx="24" fill="#fff8f0"/>
    <rect x="610" y="220" width="250" height="280" rx="24" fill="#fff8f0"/>
    <rect x="880" y="220" width="250" height="280" rx="24" fill="#fff8f0"/>
  </g>

  <g font-family="Arial, sans-serif">
    <circle cx="112" cy="264" r="22" fill="#ef6b35"/><text x="112" y="272" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">1</text>
    <text x="92" y="317" fill="#271b15" font-size="25" font-weight="800">ELECTRIC</text>
    <text x="92" y="349" fill="#271b15" font-size="25" font-weight="800">TABLETOP</text>
    <text x="92" y="394" fill="#755f51" font-size="18">Best default for</text>
    <text x="92" y="420" fill="#755f51" font-size="18">apartments and beginners</text>
    <rect x="92" y="448" width="150" height="34" rx="17" fill="#fde0d2"/><text x="167" y="471" text-anchor="middle" fill="#a43f18" font-size="15" font-weight="700">EASIEST START</text>

    <circle cx="382" cy="264" r="22" fill="#ef6b35"/><text x="382" y="272" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">2</text>
    <text x="362" y="317" fill="#271b15" font-size="25" font-weight="800">STOVETOP</text>
    <text x="362" y="349" fill="#271b15" font-size="25" font-weight="800">GRILL PAN</text>
    <text x="362" y="394" fill="#755f51" font-size="18">Best value if your stove</text>
    <text x="362" y="420" fill="#755f51" font-size="18">and hood fit the pan</text>
    <rect x="362" y="448" width="138" height="34" rx="17" fill="#e8efd9"/><text x="431" y="471" text-anchor="middle" fill="#4f6b28" font-size="15" font-weight="700">LOW STORAGE</text>

    <circle cx="652" cy="264" r="22" fill="#ef6b35"/><text x="652" y="272" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">3</text>
    <text x="632" y="317" fill="#271b15" font-size="25" font-weight="800">BUTANE</text>
    <text x="632" y="349" fill="#271b15" font-size="25" font-weight="800">+ GRILL PAN</text>
    <text x="632" y="394" fill="#755f51" font-size="18">Restaurant-like heat, but</text>
    <text x="632" y="420" fill="#755f51" font-size="18">manual rules come first</text>
    <rect x="632" y="448" width="170" height="34" rx="17" fill="#fff0c6"/><text x="717" y="471" text-anchor="middle" fill="#7c5b00" font-size="15" font-weight="700">CHECK MANUAL</text>

    <circle cx="922" cy="264" r="22" fill="#ef6b35"/><text x="922" y="272" text-anchor="middle" fill="#fff" font-size="21" font-weight="800">4</text>
    <text x="902" y="317" fill="#271b15" font-size="25" font-weight="800">GRILL +</text>
    <text x="902" y="349" fill="#271b15" font-size="25" font-weight="800">HOT POT</text>
    <text x="902" y="394" fill="#755f51" font-size="18">Best for party hosts with</text>
    <text x="902" y="420" fill="#755f51" font-size="18">storage and table space</text>
    <rect x="902" y="448" width="144" height="34" rx="17" fill="#e3e5f5"/><text x="974" y="471" text-anchor="middle" fill="#4c5187" font-size="15" font-weight="700">MOST SOCIAL</text>
  </g>

  <rect x="70" y="540" width="1060" height="78" rx="20" fill="#0f0d0b" stroke="#675247"/>
  <text x="102" y="575" fill="#ef6b35" font-family="Arial, sans-serif" font-size="20" font-weight="800">NON-NEGOTIABLE</text>
  <text x="102" y="602" fill="#f6e8da" font-family="Arial, sans-serif" font-size="20">Charcoal stays outdoors. “Smokeless” means reduced smoke, not zero ventilation.</text>
  <text x="1090" y="648" text-anchor="end" fill="#9f8d80" font-family="Arial, sans-serif" font-size="16" letter-spacing="2">EPICKOR.COM</text>
</svg>
