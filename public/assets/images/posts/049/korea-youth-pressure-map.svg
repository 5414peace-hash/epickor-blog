<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Korea youth pressure map</title>
  <desc id="desc">A careful editorial map of work, housing, education cost, family expectations, and personal choice in Korea's youth debate.</desc>
  <rect width="1400" height="900" fill="#f8fafc"/>
  <rect x="92" y="82" width="1216" height="736" rx="54" fill="#ffffff" stroke="#475569" stroke-width="6"/>
  <text x="150" y="166" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="800" fill="#0f172a">Why “stuck” feels structural</text>
  <text x="150" y="216" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#475569">Not one cause. A stack of life-planning constraints.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="160" y="310" width="470" height="120" rx="26" fill="#e0f2fe"/>
    <text x="205" y="380" font-size="34" font-weight="800" fill="#075985">Work quality</text>
    <rect x="770" y="310" width="470" height="120" rx="26" fill="#fee2e2"/>
    <text x="815" y="380" font-size="34" font-weight="800" fill="#991b1b">Housing burden</text>
    <rect x="160" y="500" width="470" height="120" rx="26" fill="#fef3c7"/>
    <text x="205" y="570" font-size="34" font-weight="800" fill="#92400e">Education costs</text>
    <rect x="770" y="500" width="470" height="120" rx="26" fill="#dcfce7"/>
    <text x="815" y="570" font-size="34" font-weight="800" fill="#166534">Family roles</text>
    <rect x="465" y="660" width="470" height="96" rx="26" fill="#ede9fe"/>
    <text x="535" y="720" font-size="32" font-weight="800" fill="#5b21b6">Choice gets delayed</text>
  </g>
  <text x="150" y="775" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#475569">EpicKor note: describe pressure without flattening a whole generation.</text>
</svg>
