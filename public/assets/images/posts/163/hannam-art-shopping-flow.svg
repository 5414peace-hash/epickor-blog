<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Hannam art and shopping flow</title>
  <desc id="desc">A Hannam-dong route concept for gallery, lifestyle shop, dinner, and cafe planning.</desc>
  <rect width="1200" height="800" fill="#fdf2f8"/>
  <rect x="95" y="95" width="1010" height="610" rx="44" fill="#fff"/>
  <text x="600" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="50" font-weight="800" fill="#831843">HANNAM SLOW LOOP</text>
  <g font-family="Arial,sans-serif" fill="#831843">
    <rect x="170" y="265" width="200" height="240" rx="28" fill="#fce7f3"/><text x="270" y="360" text-anchor="middle" font-size="32" font-weight="800">Art</text><text x="270" y="410" text-anchor="middle" font-size="22">museum / gallery</text>
    <rect x="390" y="265" width="200" height="240" rx="28" fill="#fae8ff"/><text x="490" y="360" text-anchor="middle" font-size="32" font-weight="800">Shop</text><text x="490" y="410" text-anchor="middle" font-size="22">curated brands</text>
    <rect x="610" y="265" width="200" height="240" rx="28" fill="#fce7f3"/><text x="710" y="360" text-anchor="middle" font-size="32" font-weight="800">Cafe</text><text x="710" y="410" text-anchor="middle" font-size="22">quiet break</text>
    <rect x="830" y="265" width="200" height="240" rx="28" fill="#fae8ff"/><text x="930" y="360" text-anchor="middle" font-size="32" font-weight="800">Dinner</text><text x="930" y="410" text-anchor="middle" font-size="22">reserve early</text>
  </g>
  <text x="600" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#9d174d">Hannam rewards reservations, gallery hours, and slower walking.</text>
</svg>
