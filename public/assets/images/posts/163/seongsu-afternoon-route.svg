<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Seongsu afternoon route</title>
  <desc id="desc">A simple Seongsu route from station to cafe, pop-up, shop, and Seoul Forest.</desc>
  <rect width="1200" height="800" fill="#ecfeff"/>
  <text x="600" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="50" font-weight="800" fill="#164e63">SEONGSU HALF-DAY FLOW</text>
  <g font-family="Arial,sans-serif" font-size="28" fill="#164e63" font-weight="700">
    <circle cx="210" cy="390" r="78" fill="#fff"/>
    <text x="210" y="383" text-anchor="middle">Station</text><text x="210" y="420" text-anchor="middle" font-size="22">Line 2</text>
    <circle cx="470" cy="390" r="78" fill="#fff"/>
    <text x="470" y="383" text-anchor="middle">Cafe</text><text x="470" y="420" text-anchor="middle" font-size="22">warehouse</text>
    <circle cx="730" cy="390" r="78" fill="#fff"/>
    <text x="730" y="383" text-anchor="middle">Pop-up</text><text x="730" y="420" text-anchor="middle" font-size="22">check today</text>
    <circle cx="990" cy="390" r="78" fill="#fff"/>
    <text x="990" y="383" text-anchor="middle">Forest</text><text x="990" y="420" text-anchor="middle" font-size="22">slow exit</text>
  </g>
  <path d="M292 390 H388 M552 390 H648 M812 390 H908" stroke="#0891b2" stroke-width="14" stroke-linecap="round"/>
  <text x="600" y="620" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#155e75">Do less. Check current pop-ups. Leave room for one lucky find.</text>
</svg>
