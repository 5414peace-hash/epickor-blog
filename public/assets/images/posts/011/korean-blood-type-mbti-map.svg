<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Korean blood type and MBTI culture map</title>
  <desc id="desc">A stylized EpicKor map explaining Korean blood type personality as pop culture small talk, not science, and comparing it with MBTI.</desc>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <rect x="80" y="80" width="1040" height="640" rx="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="6"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="125" y="155" fill="#0f172a" font-size="50" font-weight="850">BLOOD TYPE ≠ PERSONALITY TEST</text>
    <text x="128" y="200" fill="#475569" font-size="24">In Korea, it works more like pop-culture small talk.</text>
    <g transform="translate(135 270)">
      <circle cx="80" cy="80" r="65" fill="#fee2e2"/><text x="56" y="92" fill="#991b1b" font-size="38" font-weight="850">A</text>
      <text x="160" y="72" fill="#334155" font-size="24" font-weight="800">careful / considerate</text>
      <text x="160" y="108" fill="#64748b" font-size="20">recognizable stereotype, not proof</text>
    </g>
    <g transform="translate(630 270)">
      <circle cx="80" cy="80" r="65" fill="#dbeafe"/><text x="56" y="92" fill="#1d4ed8" font-size="38" font-weight="850">B</text>
      <text x="160" y="72" fill="#334155" font-size="24" font-weight="800">free / intense</text>
      <text x="160" y="108" fill="#64748b" font-size="20">dating jokes can be unfair</text>
    </g>
    <g transform="translate(135 450)">
      <circle cx="80" cy="80" r="65" fill="#dcfce7"/><text x="52" y="92" fill="#166534" font-size="38" font-weight="850">O</text>
      <text x="160" y="72" fill="#334155" font-size="24" font-weight="800">social / leader-like</text>
      <text x="160" y="108" fill="#64748b" font-size="20">use lightly, not literally</text>
    </g>
    <g transform="translate(630 450)">
      <circle cx="80" cy="80" r="65" fill="#fef3c7"/><text x="36" y="92" fill="#92400e" font-size="38" font-weight="850">AB</text>
      <text x="160" y="72" fill="#334155" font-size="24" font-weight="800">unusual / rational</text>
      <text x="160" y="108" fill="#64748b" font-size="20">do not label someone “weird”</text>
    </g>
    <rect x="295" y="625" width="610" height="56" rx="28" fill="#111827"/>
    <text x="332" y="662" fill="#ffffff" font-size="24" font-weight="800">MBTI took over, but the small-talk function stayed.</text>
    <text x="125" y="690" fill="#94a3b8" font-size="18" font-weight="700">EPICKOR.COM</text>
  </g>
</svg>
