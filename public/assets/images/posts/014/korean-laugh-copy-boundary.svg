<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Korean laugh-clap boundary guide</title>
  <desc id="desc">A guide showing safe Korean laugh-clap reactions to copy and physical reactions visitors should avoid unless close.</desc>
  <rect width="1200" height="800" fill="#fff1f2"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="100" y="130" fill="#881337" font-size="50" font-weight="850">COPY THE SUPPORT, NOT THE TOUCH</text>
    <text x="103" y="178" fill="#9f1239" font-size="24">Warm reaction is welcome. Uninvited contact is not.</text>
    <rect x="105" y="240" width="465" height="360" rx="30" fill="#dcfce7"/>
    <text x="150" y="305" fill="#14532d" font-size="34" font-weight="850">SAFER TO COPY</text>
    <text x="150" y="370" fill="#166534" font-size="26">✓ Laugh naturally</text>
    <text x="150" y="425" fill="#166534" font-size="26">✓ Clap your own hands</text>
    <text x="150" y="480" fill="#166534" font-size="26">✓ Cheer at noraebang</text>
    <text x="150" y="535" fill="#166534" font-size="26">✓ React to show you listen</text>
    <rect x="630" y="240" width="465" height="360" rx="30" fill="#fee2e2"/>
    <text x="675" y="305" fill="#991b1b" font-size="34" font-weight="850">AVOID UNLESS CLOSE</text>
    <text x="675" y="370" fill="#b91c1c" font-size="26">× Arm slaps</text>
    <text x="675" y="425" fill="#b91c1c" font-size="26">× Filming strangers</text>
    <text x="675" y="480" fill="#b91c1c" font-size="26">× Loud public performance</text>
    <text x="675" y="535" fill="#b91c1c" font-size="26">× “So Korean” mocking</text>
    <text x="105" y="690" fill="#be123c" font-size="18" font-weight="700">EPICKOR.COM</text>
  </g>
</svg>
