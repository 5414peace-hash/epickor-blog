<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Korean pantry starter shelf map</title>
  <desc id="desc">Editorial graphic showing a Korean pantry starter kit with rice, gochujang, ssamjang, seaweed, ramen, coffee mix, and table tools.</desc>
  <rect width="1200" height="675" fill="#f6f0e6"/>
  <rect x="70" y="68" width="1060" height="540" rx="28" fill="#ffffff" stroke="#151515" stroke-width="4"/>
  <text x="110" y="126" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#151515">Korean pantry starter kit</text>
  <text x="112" y="166" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#5b5b5b">Build a small shelf that creates repeat meals, not a wall of unopened packages.</text>
  <line x1="100" y1="236" x2="1100" y2="236" stroke="#151515" stroke-width="5"/>
  <line x1="100" y1="427" x2="1100" y2="427" stroke="#151515" stroke-width="5"/>

  <rect x="135" y="266" width="148" height="122" rx="16" fill="#f6d365" stroke="#151515" stroke-width="3"/>
