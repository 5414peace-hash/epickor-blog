  <text x="354" y="362" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fff8e8">sweet-spicy</text>

  <rect x="485" y="250" width="112" height="142" rx="18" fill="#7a4a2a" stroke="#151515" stroke-width="3"/>
  <rect x="501" y="283" width="80" height="56" rx="8" fill="#fff8e8"/>
  <text x="510" y="318" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#151515">SSAM</text>
  <text x="506" y="362" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fff8e8">wrap sauce</text>

  <rect x="650" y="276" width="150" height="108" rx="16" fill="#2e6f48" stroke="#151515" stroke-width="3"/>
  <rect x="674" y="300" width="102" height="42" rx="6" fill="#fff8e8"/>
