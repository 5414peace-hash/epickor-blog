  <text x="174" y="527" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5b5b5b">watch-party lane</text>

  <rect x="390" y="462" width="170" height="88" rx="15" fill="#ffe1e1" stroke="#151515" stroke-width="3"/>
  <text x="418" y="499" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#151515">quick stew</text>
