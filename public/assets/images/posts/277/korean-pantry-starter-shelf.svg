  <text x="158" y="350" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#151515">base layer</text>

  <rect x="330" y="250" width="112" height="142" rx="18" fill="#b92f25" stroke="#151515" stroke-width="3"/>
