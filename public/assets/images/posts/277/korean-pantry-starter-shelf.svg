  <text x="681" y="364" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fff8e8">seaweed snack</text>

  <rect x="845" y="258" width="155" height="128" rx="18" fill="#ff7043" stroke="#151515" stroke-width="3"/>
  <circle cx="921" cy="321" r="38" fill="#ffe8bf" stroke="#151515" stroke-width="3"/>
  <text x="875" y="371" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#151515">RAMEN</text>

  <rect x="150" y="462" width="180" height="88" rx="15" fill="#f4f4f4" stroke="#151515" stroke-width="3"/>
