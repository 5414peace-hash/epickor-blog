<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Korean ramyun topping map</title>
  <desc id="desc">A practical topping map showing egg, green onion, cheese, dumplings, rice, and kimchi for Korean ramyun bowls.</desc>
  <rect width="1400" height="900" fill="#f8fafc"/>
  <circle cx="700" cy="465" r="250" fill="#fecaca"/>
  <circle cx="700" cy="465" r="190" fill="#fed7aa"/>
  <circle cx="700" cy="465" r="120" fill="#fde68a"/>
  <text x="530" y="450" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#7f1d1d">RAMYUN</text>
  <text x="555" y="498" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#9a3412">build the bowl</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">
    <rect x="130" y="150" width="310" height="100" rx="26" fill="#ffffff" stroke="#f97316" stroke-width="4"/>
    <text x="190" y="212" fill="#9a3412">Egg</text>
    <rect x="960" y="150" width="310" height="100" rx="26" fill="#ffffff" stroke="#22c55e" stroke-width="4"/>
    <text x="1012" y="212" fill="#166534">Green onion</text>
    <rect x="130" y="650" width="310" height="100" rx="26" fill="#ffffff" stroke="#eab308" stroke-width="4"/>
    <text x="185" y="712" fill="#854d0e">Cheese</text>
    <rect x="960" y="650" width="310" height="100" rx="26" fill="#ffffff" stroke="#ef4444" stroke-width="4"/>
    <text x="1030" y="712" fill="#991b1b">Kimchi</text>
    <rect x="545" y="720" width="310" height="100" rx="26" fill="#ffffff" stroke="#3b82f6" stroke-width="4"/>
    <text x="615" y="782" fill="#1d4ed8">Dumplings</text>
    <rect x="545" y="80" width="310" height="100" rx="26" fill="#ffffff" stroke="#64748b" stroke-width="4"/>
    <text x="640" y="142" fill="#334155">Rice</text>
  </g>
  <text x="210" y="835" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#475569">Add one or two toppings. Too many turns the bowl muddy.</text>
</svg>
