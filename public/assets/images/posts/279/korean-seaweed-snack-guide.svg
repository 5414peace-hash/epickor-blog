<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Korean seaweed snack guide</title>
  <desc id="desc">Editorial graphic showing Korean seaweed snack packs, rice, gim sheets, and lunchbox pairing logic.</desc>
  <rect width="1200" height="675" fill="#eef5ef"/>
  <rect x="70" y="70" width="1060" height="535" rx="30" fill="#ffffff" stroke="#151515" stroke-width="4"/>
  <text x="112" y="132" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#151515">Korean seaweed snack guide</text>
  <text x="114" y="171" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#47634e">Snack, rice side, gimbap sheet, gift box: same shelf, different jobs.</text>

  <rect x="140" y="238" width="185" height="260" rx="20" fill="#1f6b45" stroke="#151515" stroke-width="4"/>
  <rect x="165" y="275" width="135" height="68" rx="10" fill="#fff8df"/>
  <text x="186" y="318" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#151515">GIM</text>
  <text x="171" y="396" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#fff8df">snack pack</text>
  <text x="171" y="426" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#fff8df">small + crisp</text>

  <circle cx="525" cy="362" r="110" fill="#fff8df" stroke="#151515" stroke-width="4"/>
  <ellipse cx="525" cy="365" rx="78" ry="38" fill="#f7d27c"/>
  <rect x="450" y="312" width="150" height="46" rx="8" fill="#1f6b45" stroke="#151515" stroke-width="3"/>
  <text x="469" y="440" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#151515">rice pairing</text>

  <rect x="765" y="250" width="245" height="220" rx="18" fill="#eaf0ff" stroke="#151515" stroke-width="4"/>
  <rect x="795" y="285" width="185" height="48" rx="8" fill="#1f6b45"/>
  <rect x="795" y="350" width="185" height="48" rx="8" fill="#1f6b45"/>
  <rect x="795" y="415" width="185" height="22" rx="8" fill="#1f6b45"/>
  <text x="809" y="514" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#151515">sheet or gift box?</text>

  <rect x="142" y="545" width="915" height="38" rx="19" fill="#151515"/>
  <text x="174" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Rule: choose by job first. Snack packs are not the same as gimbap sheets.</text>
  <text x="962" y="632" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#151515">EPICKOR.COM</text>
</svg>
