<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Viyott cold-shelf buying guide</title>
  <desc id="desc">A simple EpicKor illustration showing Viyott as a refrigerated Korean convenience-store yogurt snack.</desc>
  <rect width="1200" height="800" fill="#f7efe7"/>
  <rect x="110" y="115" width="980" height="560" rx="42" fill="#fffaf4" stroke="#2f251f" stroke-width="8"/>
  <rect x="160" y="165" width="880" height="95" rx="18" fill="#dbeafe"/>
  <text x="600" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#1e3a8a">REFRIGERATED SNACK SHELF</text>
  <g transform="translate(210 325)">
    <rect width="230" height="210" rx="28" fill="#fef3c7" stroke="#92400e" stroke-width="6"/>
    <line x1="115" y1="0" x2="115" y2="210" stroke="#92400e" stroke-width="5"/>
    <circle cx="68" cy="108" r="42" fill="#fff7ed" stroke="#9a3412" stroke-width="5"/>
    <g fill="#7c2d12">
      <circle cx="157" cy="68" r="18"/>
      <circle cx="194" cy="102" r="16"/>
      <circle cx="160" cy="142" r="15"/>
      <circle cx="200" cy="158" r="13"/>
    </g>
    <text x="115" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#3b2418">1. KEEP COLD</text>
  </g>
  <g transform="translate(500 340)">
    <path d="M40 110 C120 20, 205 20, 285 110" fill="none" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
    <polygon points="285,110 235,105 265,70" fill="#2563eb"/>
    <text x="162" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#1d4ed8">2. FOLD + MIX</text>
  </g>
  <g transform="translate(800 325)">
    <rect width="190" height="210" rx="28" fill="#fce7f3" stroke="#9d174d" stroke-width="6"/>
    <circle cx="95" cy="105" r="66" fill="#fff1f2" stroke="#9d174d" stroke-width="5"/>
    <g fill="#7c2d12">
      <circle cx="77" cy="85" r="13"/>
      <circle cx="112" cy="92" r="12"/>
      <circle cx="88" cy="123" r="12"/>
      <circle cx="122" cy="129" r="10"/>
    </g>
    <text x="95" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#831843">3. EAT SOON</text>
  </g>
  <text x="600" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#4b5563">Fresh dairy: enjoy in Korea, pack dry snacks for gifts.</text>
</svg>
