<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Korean red ginseng label checklist</title>
  <desc id="desc">A checklist graphic for comparing Korean red ginseng product labels, serving size, ingredients, expiry date, and caution notes.</desc>
  <rect width="1200" height="800" fill="#fff7ed"/>
  <circle cx="1025" cy="140" r="120" fill="#c62828" opacity=".13"/>
  <circle cx="170" cy="670" r="150" fill="#d7a36a" opacity=".18"/>
  <text x="88" y="96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#9b2d20">EPICKOR WELLNESS GUIDE</text>
  <text x="88" y="170" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#261b16">Korean red ginseng</text>
  <text x="88" y="232" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#6d3d2a">label checklist</text>
  <rect x="95" y="295" width="1010" height="390" rx="34" fill="#ffffff" stroke="#d7a36a" stroke-width="5"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#261b16">
    <g font-weight="800">
      <text x="180" y="365">Product format</text>
      <text x="180" y="435">Serving size</text>
      <text x="180" y="505">Ingredient list</text>
      <text x="180" y="575">Expiry date</text>
      <text x="180" y="645">Caution notes</text>
    </g>
    <g fill="#a12b20" font-size="34" font-weight="900">
      <text x="130" y="365">✓</text>
      <text x="130" y="435">✓</text>
      <text x="130" y="505">✓</text>
      <text x="130" y="575">✓</text>
      <text x="130" y="645">✓</text>
    </g>
    <g font-size="23" fill="#64534b">
      <text x="455" y="365">extract · stick · capsule · tea · drink</text>
      <text x="455" y="435">how much, how often, and for whom</text>
      <text x="455" y="505">ginseng plus sweeteners or added herbs</text>
      <text x="455" y="575">especially for gifts and online purchases</text>
      <text x="455" y="645">medicine, pregnancy, diabetes, surgery</text>
    </g>
  </g>
  <text x="88" y="742" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#9b2d20">A premium box is not enough. Read the label before the promise.</text>
</svg>
