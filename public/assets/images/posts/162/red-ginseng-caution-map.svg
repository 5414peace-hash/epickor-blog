<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Korean red ginseng caution map</title>
  <desc id="desc">A caution map for Korean red ginseng showing medication, pregnancy, children, diabetes, surgery, and bleeding-related concerns.</desc>
  <rect width="1200" height="800" fill="#241819"/>
  <rect x="70" y="70" width="1060" height="660" rx="44" fill="#fffaf2"/>
  <text x="115" y="145" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#b3261e">EPICKOR SAFETY NOTE</text>
  <text x="115" y="215" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#241819">Pause before gifting</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="600" cy="425" r="100" fill="#ffe0d6" stroke="#b3261e" stroke-width="6"/>
    <text x="538" y="415" font-size="31" font-weight="800" fill="#241819">Ask a</text>
    <text x="510" y="456" font-size="31" font-weight="800" fill="#241819">professional</text>
    <g fill="#ffffff" stroke="#c78a63" stroke-width="4">
      <rect x="125" y="310" width="250" height="98" rx="24"/>
      <rect x="125" y="470" width="250" height="98" rx="24"/>
      <rect x="825" y="310" width="250" height="98" rx="24"/>
      <rect x="825" y="470" width="250" height="98" rx="24"/>
      <rect x="475" y="585" width="250" height="98" rx="24"/>
    </g>
    <g font-size="25" font-weight="800" fill="#241819">
      <text x="165" y="370">Medication use</text>
      <text x="165" y="530">Pregnancy / nursing</text>
      <text x="865" y="370">Diabetes concerns</text>
      <text x="865" y="530">Surgery / bleeding</text>
      <text x="515" y="645">Children</text>
    </g>
    <g stroke="#b3261e" stroke-width="5" stroke-linecap="round">
      <path d="M385 360h95"/>
      <path d="M385 520h90"/>
      <path d="M725 360h90"/>
      <path d="M725 520h90"/>
      <path d="M600 530v45"/>
    </g>
  </g>
  <text x="115" y="692" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#6d4d3e">Wellness gift does not mean risk-free. Match the product to the person.</text>
</svg>
