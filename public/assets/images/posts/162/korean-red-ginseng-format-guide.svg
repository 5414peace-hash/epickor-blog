<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Korean red ginseng product format guide</title>
  <desc id="desc">A product format guide comparing Korean red ginseng extract, sticks, capsules, tea, candy, and gift sets.</desc>
  <rect width="1200" height="800" fill="#f7fbf5"/>
  <text x="78" y="98" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#5c7b32">EPICKOR SHOPPING GUIDE</text>
  <text x="78" y="172" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#1f2b19">Choose the format</text>
  <text x="78" y="232" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#7a3b25">before the brand</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="85" y="310" width="300" height="135" rx="26" fill="#ffffff" stroke="#b88a55" stroke-width="4"/>
    <rect x="450" y="310" width="300" height="135" rx="26" fill="#ffffff" stroke="#b88a55" stroke-width="4"/>
    <rect x="815" y="310" width="300" height="135" rx="26" fill="#ffffff" stroke="#b88a55" stroke-width="4"/>
    <rect x="85" y="520" width="300" height="135" rx="26" fill="#ffffff" stroke="#b88a55" stroke-width="4"/>
    <rect x="450" y="520" width="300" height="135" rx="26" fill="#ffffff" stroke="#b88a55" stroke-width="4"/>
    <rect x="815" y="520" width="300" height="135" rx="26" fill="#ffffff" stroke="#b88a55" stroke-width="4"/>
    <g font-size="29" font-weight="800" fill="#1f2b19">
      <text x="125" y="365">Extract jar</text>
      <text x="490" y="365">Stick pouches</text>
      <text x="855" y="365">Capsules</text>
      <text x="125" y="575">Tea / drink</text>
      <text x="490" y="575">Candy / jelly</text>
      <text x="855" y="575">Gift set</text>
    </g>
    <g font-size="22" fill="#5b604f">
      <text x="125" y="407">strong taste · higher control</text>
      <text x="490" y="407">office · travel · easy portion</text>
      <text x="855" y="407">less bitter · check dosage</text>
      <text x="125" y="617">casual tasting · often milder</text>
      <text x="490" y="617">souvenir first, function second</text>
      <text x="855" y="617">impressive, but recipient-specific</text>
    </g>
  </g>
  <text x="78" y="735" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5c7b32">The best red ginseng product is the one the recipient can actually use safely.</text>
</svg>
