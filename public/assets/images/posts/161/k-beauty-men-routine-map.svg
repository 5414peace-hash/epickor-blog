<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">K-beauty for men routine map</title>
  <desc id="desc">A simple K-beauty for men routine map: cleanser, shaving care, moisturizer, and sunscreen.</desc>
  <rect width="1200" height="800" fill="#ecfeff"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="95" y="140" fill="#164e63" font-size="54" font-weight="850">K-BEAUTY FOR MEN</text>
    <text x="98" y="185" fill="#0e7490" font-size="24">Simple first. Consistent second. Fancy later.</text>
    <g transform="translate(115 270)">
      <rect width="220" height="230" rx="28" fill="#ffffff" stroke="#67e8f9" stroke-width="5"/>
      <text x="38" y="80" fill="#155e75" font-size="30" font-weight="850">CLEANSE</text>
      <text x="38" y="125" fill="#0e7490" font-size="20">mild face wash</text>
    </g>
    <g transform="translate(365 270)">
      <rect width="220" height="230" rx="28" fill="#ffffff" stroke="#a7f3d0" stroke-width="5"/>
      <text x="38" y="80" fill="#166534" font-size="30" font-weight="850">SHAVE</text>
      <text x="38" y="125" fill="#15803d" font-size="20">reduce friction</text>
    </g>
    <g transform="translate(615 270)">
      <rect width="220" height="230" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="5"/>
      <text x="38" y="80" fill="#1e40af" font-size="30" font-weight="850">MOISTURIZE</text>
      <text x="38" y="125" fill="#1d4ed8" font-size="20">support barrier</text>
    </g>
    <g transform="translate(865 270)">
      <rect width="220" height="230" rx="28" fill="#ffffff" stroke="#fde68a" stroke-width="5"/>
      <text x="38" y="80" fill="#92400e" font-size="30" font-weight="850">SPF</text>
      <text x="38" y="125" fill="#a16207" font-size="20">daily protection</text>
    </g>
    <text x="95" y="690" fill="#0891b2" font-size="18" font-weight="700">EPICKOR.COM</text>
  </g>
</svg>
