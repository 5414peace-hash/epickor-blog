<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">K-beauty for men skip-first guide</title>
  <desc id="desc">A guide showing what men should skip first in skincare: harsh soap, too many actives, dry shaving, and sunscreen skipping.</desc>
  <rect width="1200" height="800" fill="#fff7ed"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="100" y="135" fill="#9a3412" font-size="54" font-weight="850">SKIP THESE FIRST</text>
    <text x="104" y="182" fill="#c2410c" font-size="25">A strong routine starts by removing friction.</text>
    <g transform="translate(120 260)">
      <rect width="460" height="125" rx="24" fill="#fee2e2"/>
      <text x="35" y="55" fill="#991b1b" font-size="30" font-weight="850">HARSH SOAP</text>
      <text x="35" y="92" fill="#b91c1c" font-size="21">tight is not the same as clean</text>
    </g>
    <g transform="translate(620 260)">
      <rect width="460" height="125" rx="24" fill="#fef3c7"/>
      <text x="35" y="55" fill="#92400e" font-size="30" font-weight="850">TOO MANY ACTIVES</text>
      <text x="35" y="92" fill="#a16207" font-size="21">one new variable at a time</text>
    </g>
    <g transform="translate(120 445)">
      <rect width="460" height="125" rx="24" fill="#dbeafe"/>
      <text x="35" y="55" fill="#1e3a8a" font-size="30" font-weight="850">DRY SHAVING</text>
      <text x="35" y="92" fill="#1d4ed8" font-size="21">wet, cushion, and go with growth</text>
    </g>
    <g transform="translate(620 445)">
      <rect width="460" height="125" rx="24" fill="#dcfce7"/>
      <text x="35" y="55" fill="#166534" font-size="30" font-weight="850">SPF SKIPPING</text>
      <text x="35" y="92" fill="#15803d" font-size="21">daily comfort beats rare perfection</text>
    </g>
    <text x="100" y="690" fill="#ea580c" font-size="18" font-weight="700">EPICKOR.COM</text>
  </g>
</svg>
