<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Carbo Buldak cooking and safety flow</title>
  <desc id="desc">A step-by-step graphic for boiling, draining, saucing, tasting, and customizing Carbo Buldak safely.</desc>
  <rect width="1200" height="800" fill="#15151f"/>
  <rect x="64" y="60" width="1072" height="680" rx="44" fill="#fff7f0"/>
  <text x="110" y="132" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#e63a48">EPICKOR RAMEN NOTE</text>
  <text x="110" y="196" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#211d24">Don't cook it like soup</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="110" y="300" width="180" height="180" rx="30" fill="#ffffff" stroke="#ff6b7d" stroke-width="5"/>
    <text x="152" y="365" font-size="32" font-weight="800" fill="#211d24">1</text>
    <text x="152" y="410" font-size="25" font-weight="700" fill="#211d24">Boil noodles</text>
    <text x="152" y="445" font-size="20" fill="#655f6b">springy, not mushy</text>
    <path d="M310 390h80" stroke="#211d24" stroke-width="8" stroke-linecap="round"/>
    <path d="M370 360l34 30-34 30" fill="none" stroke="#211d24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="420" y="300" width="180" height="180" rx="30" fill="#ffffff" stroke="#ff6b7d" stroke-width="5"/>
    <text x="462" y="365" font-size="32" font-weight="800" fill="#211d24">2</text>
    <text x="462" y="410" font-size="25" font-weight="700" fill="#211d24">Drain most</text>
    <text x="462" y="445" font-size="20" fill="#655f6b">keep a splash</text>
    <path d="M620 390h80" stroke="#211d24" stroke-width="8" stroke-linecap="round"/>
    <path d="M680 360l34 30-34 30" fill="none" stroke="#211d24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="730" y="300" width="180" height="180" rx="30" fill="#ffffff" stroke="#ff6b7d" stroke-width="5"/>
    <text x="772" y="365" font-size="32" font-weight="800" fill="#211d24">3</text>
    <text x="772" y="410" font-size="25" font-weight="700" fill="#211d24">Sauce gently</text>
    <text x="772" y="445" font-size="20" fill="#655f6b">glossy, not dry</text>
    <path d="M930 390h70" stroke="#211d24" stroke-width="8" stroke-linecap="round"/>
    <path d="M980 360l34 30-34 30" fill="none" stroke="#211d24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="840" y="540" width="250" height="105" rx="26" fill="#ffe0e6" stroke="#e63a48" stroke-width="4"/>
    <text x="880" y="582" font-size="24" font-weight="800" fill="#211d24">Taste before</text>
    <text x="880" y="616" font-size="24" font-weight="800" fill="#211d24">adding more heat</text>
    <rect x="110" y="540" width="640" height="105" rx="26" fill="#ffffff" stroke="#f4b0bc" stroke-width="4"/>
    <text x="150" y="584" font-size="24" font-weight="800" fill="#211d24">Easy softeners:</text>
    <text x="350" y="584" font-size="24" fill="#211d24">egg · milk · cabbage · cheese · plain rice</text>
    <text x="150" y="622" font-size="21" fill="#655f6b">Carbo Buldak is fun food, not a challenge you have to win.</text>
  </g>
</svg>
