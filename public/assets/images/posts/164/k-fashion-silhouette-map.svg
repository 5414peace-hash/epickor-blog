<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">K-fashion silhouette map</title>
  <desc id="desc">A simple guide to oversized, tailored, and technical Korean fashion silhouettes.</desc>
  <rect width="1200" height="800" fill="#111827"/>
  <text x="600" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="52" font-weight="800" fill="#fff">K-FASHION SILHOUETTE MAP</text>
  <g font-family="Arial,sans-serif" fill="#fff">
    <rect x="120" y="250" width="260" height="330" rx="34" fill="#374151"/>
    <text x="250" y="345" text-anchor="middle" font-size="34" font-weight="800">OVERSIZED</text><text x="250" y="410" text-anchor="middle" font-size="24">volume with intent</text>
    <rect x="470" y="250" width="260" height="330" rx="34" fill="#4b5563"/>
    <text x="600" y="345" text-anchor="middle" font-size="34" font-weight="800">TAILORED</text><text x="600" y="410" text-anchor="middle" font-size="24">clean shoulder line</text>
    <rect x="820" y="250" width="260" height="330" rx="34" fill="#374151"/>
    <text x="950" y="345" text-anchor="middle" font-size="34" font-weight="800">TECHNICAL</text><text x="950" y="410" text-anchor="middle" font-size="24">utility detail</text>
  </g>
  <text x="600" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#d1d5db">EpicKor.com · Seoul fashion guide</text>
</svg>
