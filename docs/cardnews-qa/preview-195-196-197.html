<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EpicKor Card News Preview 195-197</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #151515;
      --muted: #6b7280;
      --line: #e5e7eb;
      --paper: #f7f7f4;
      --panel: #ffffff;
      --accent: #c93d32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(247, 247, 244, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .bar {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }
    .meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    nav a {
      color: var(--ink);
      text-decoration: none;
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
    }
    nav a:hover { border-color: var(--accent); color: var(--accent); }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }
    section {
      padding-top: 18px;
      margin-bottom: 44px;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }
    figure {
      margin: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    figure img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #f0f0ec;
    }
    figcaption {
      padding: 9px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .links {
      margin: 12px 0 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .links a {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    @media (max-width: 720px) {
      .bar { align-items: flex-start; flex-direction: column; }
      main { padding-inline: 12px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    }
  </style>
</head>
